# Static file serving for the SPA. Not a proxy, and deliberately not one: the browser
# talks to the API directly at its own hostname (see web/src/api/client.ts), so this
# server never sees a /v1 request and holds no credential of any kind.

server {
    # Cloud Run's $PORT, templated in by the base image: files under
    # /etc/nginx/templates/*.template are rendered through envsubst on start-up.
    listen       ${PORT};
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames change whenever their contents do, so they can be cached
    # indefinitely without ever serving a stale one.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cached, either of them. index.html names the current hashed bundles, and
    # config.js carries the API origin this container was started with — a cached copy
    # of either survives a deploy and points the browser at the previous release.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # History fallback. The SPA routes on the path, so a reload of /episodes/ep_123 must
    # return index.html rather than 404 — the bundle reads the URL and renders from it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
