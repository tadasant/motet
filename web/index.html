<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motet</title>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Runtime configuration, loaded before the bundle so the API origin is known by the
      time the first request goes out. Deliberately NOT a module and NOT deferred: both
      would run it after the bundle. Rewritten by the container entrypoint at start-up —
      see web/public/config.js.
    -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
