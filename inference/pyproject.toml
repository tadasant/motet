[project]
name = "motet-inference"
version = "0.1.0"
description = "Inference stage interfaces, fakes, and vendor adapters (invariant 7)"
requires-python = ">=3.13"
# httpx is the only runtime dependency: the OpenRouter adapter needs an HTTP client with
# real timeouts. It is imported lazily, so a fake-mode process never touches it.
dependencies = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motet_inference"]
