[project]
name = "motet-workers"
version = "0.1.0"
description = "Ingestion and pipeline workers (Cloud Run jobs)"
requires-python = ">=3.13"
dependencies = ["motet-db", "motet-inference", "motet-storage", "psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motet_workers"]
