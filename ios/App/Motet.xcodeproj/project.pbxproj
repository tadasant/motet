// Hand-written, and deliberately tiny.
//
// Xcode 16 introduced `PBXFileSystemSynchronizedRootGroup`: a folder is a member of a
// target, and every file inside it is compiled without being listed. That is what keeps
// this file to ~150 lines with no per-file entries — which matters here, because it was
// written without an Xcode to check it against (see ios/README.md, "What is unverified").
//
// If Xcode refuses to open it, the recovery is two minutes and loses nothing: File > New >
// Project > App named "Motet", delete the generated sources, drag `App/Motet` in as a
// folder reference, and add `ios` as a local package dependency (MotetKit + MotetPlayback).
// The sources are the deliverable; this file is a convenience.
//
// THREE CONFIGURATIONS, and the third is not a copy of the first two by accident.
// `Staging` is `Debug` plus `MOTET_BUILD_ENVIRONMENT = staging`, so a build can be pointed
// at the staging deployment and *say so* — the label is not a hostname, which is what lets
// it live in a public repository when `MOTET_DEFAULT_API_BASE_URL` cannot. Both of those
// settings are empty or inherited here and passed on the command line by `ios/bin/build-app`
// and `ios/bin/testflight`; no deployment's host is written in this file or any other.
//
// TWO TARGETS. `MotetUITests` drives the app on a booted simulator, because the one
// question this project could never answer about itself — is sound actually coming out —
// has no answer from outside the app (no cloud device service captures iOS audio) and no
// answer from a compiler either. It is deliberately NOT in the `Motet` scheme's testables:
// `ios/bin/testflight` reads `-showBuildSettings -scheme Motet` to decide which
// entitlements file is signed in, and that guard reasons about the blocks it gets back.
