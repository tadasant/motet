[project]
name = "motet-sources"
version = "0.1.0"
description = "Ingestion sources — the Gmail seam, behind an interface with a fake"
requires-python = ">=3.13"
dependencies = [
    "motet-inference",
]

[project.optional-dependencies]
# Only a process that actually reaches Gmail needs an HTTP client. Fake mode — every test,
# every laptop, all of CI — does not.
gmail = ["httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motet_sources"]

[tool.uv.sources]
motet-inference = { workspace = true }
