[project]
name = "motet-voice"
version = "0.1.0"
description = "Voice service: the session contract, the provider arms, and the barge-in harness"
requires-python = ">=3.13"
# NOTE THE ABSENCE: `motet-db` is not here and must never be. Invariant 2 — the voice
# service takes a session config and calls tools; it has no database credential and no
# schema knowledge. `tests/test_no_database_access.py` asserts this list, so adding the
# dependency fails CI rather than quietly crossing the boundary.
#
# `motet-inference` is a pure library (interfaces, fakes, the LLM seam, the Cartesia
# adapter). It reaches vendors, never Postgres, so depending on it does not weaken the
# boundary — and it is what keeps `MOTET_INFERENCE_MODE` parsed in exactly one place.
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    # The MCP client, for the one path out of this process: a session's platform tools are
    # `tools/call`s on Motet's own server at `/mcp` (motet#120). The SDK rather than a
    # hand-rolled JSON-RPC client, because `McpServerBinding` exists so that Zimmer can
    # point this at servers nobody here wrote — the protocol has to be the real one, not
    # the subset Motet's server happens to accept. It reaches an HTTP endpoint and never a
    # database, so it does not weaken invariant 2; the same pin as `motet-api`, which
    # serves the other half.
    "mcp>=2.2,<3",
    "motet-inference",
    # Telemetry wiring, shared with the API and the worker. `motet-obs` depends on no
    # `motet-*` package and reaches an OTLP endpoint rather than Postgres, so taking it
    # does not weaken invariant 2 — and without it every span and log record this service
    # produces would be built against a no-op provider, which is the "looks monitored,
    # emits nothing" trap AGENTS.md names rather than a smaller version of it.
    "motet-obs",
    "motet-storage",
    "pydantic>=2.10",
    "uvicorn>=0.34",
    "websockets>=14",
]

[project.scripts]
motet-voice = "motet_voice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motet_voice"]
