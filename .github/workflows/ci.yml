name: CI

# Motet's one CI command, run on GitHub-hosted runners: `ubuntu-latest` for everything
# except `ci` (pinned to `ubuntu-24.04` for the Swift toolchain; see that job) and the iOS
# job, which needs `macos-latest`. Standard hosted runners are free and
# unmetered on a public repo, and each job gets a fresh, ephemeral VM.
#
# THE RUNNER LABELS ARE LITERALS, ON PURPOSE. This repo used to run on a shared self-hosted
# pool (moved off on 2026-11-17, after that box went down and took every runner with it).
# Never make `runs-on` a variable or an expression: on a public repo the one thing that
# must never be reachable from a fork PR is a self-hosted runner, and a literal is the
# only spelling of that a reviewer can check at a glance.
#
# The fork guard stays on every job that checks out code, even though a hosted VM is not
# the shared-machine problem it was written for:
#
#   1. Every job that checks out code carries the fork guard
#      `github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository`,
#      so a fork PR skips it and fork code never runs here.
#   2. `all-checks-pass` below aggregates the result WITHOUT a checkout, so a fork PR —
#      where everything skipped — still reports green instead of hanging on a required check.
#   3. `pr-auto-close.yml` closes outside PRs with no checkout at all.
#
# Belt-and-braces on top: the repo's Actions fork-PR approval policy is set to
# `all_external_contributors`, so a fork workflow needs a maintainer's click regardless.
#
# ADDING A JOB? It needs the fork guard, a `timeout-minutes`, AND an entry in
# `all-checks-pass`. Adding a *check*, on the other hand, belongs in `bin/ci` — a check
# that lives only in this file cannot be run on a laptop.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    # Pinned to 24.04 rather than `ubuntu-latest`, because `ios/bin/install-swift-toolchain`
    # installs swift.org's Ubuntu 24.04 build, and on `ubuntu-latest` (26.04 since late 2026)
    # `swift-build` fails to load `libxml2.so.2`. Move this together with the toolchain's
    # target distribution, never on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: motet_test
        # A dynamic host port, resolved below. Nothing else shares this VM, so a fixed 5432
        # would also work; the dynamic one costs nothing and keeps the step honest.
        ports:
          - 5432/tcp
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # GitHub-hosted runners export CI=true already. Kept explicit, because `ios/bin/ci-swift`
      # and `ios/bin/build-app` fail rather than skip when it is set.
      CI: true
      UV_VERSION: "0.12.3"
      MOTET_SWIFT_VERSION: "6.2"

    steps:
      - uses: actions/checkout@v4

      - name: Resolve dynamic service ports
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:${{ job.services.postgres.ports[5432] }}/motet_test" >> "$GITHUB_ENV"

      - name: Install uv
        # uv manages its own CPython (`requires-python` in the workspace), so there is no
        # setup-python step. The cache is GitHub's Actions cache, keyed on `uv.lock`.
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore the Swift toolchain
        # MotetKit — the iOS client's logic — is tested by `bin/ci`. The toolchain is ~1 GB,
        # so it is restored from the Actions cache rather than downloaded on every run. The
        # key is the version and the install script, which is all the directory depends on.
        id: swift-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/swift
          key: swift-${{ env.MOTET_SWIFT_VERSION }}-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ hashFiles('ios/bin/install-swift-toolchain') }}

      - name: Install the Swift toolchain
        # A no-op beyond writing the shim when the cache restored the toolchain. Without this
        # step `bin/ci` skips the iOS tests rather than failing, which is why this is a real
        # step and not `continue-on-error`.
        run: |
          SHIM_DIR=$(ios/bin/install-swift-toolchain "${RUNNER_TEMP}/swift")
          echo "$SHIM_DIR" >> "$GITHUB_PATH"

      - name: Save the Swift toolchain
        # Saved here, straight after the install and its self-check, rather than in a post
        # step: `actions/cache` saves only when the whole job succeeds, so a red test would
        # otherwise mean re-downloading 1 GB on every run until something went green.
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/swift
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Run the one CI command
        run: bin/ci

  # The container images Cloud Run runs. A separate job because it needs a Docker daemon
  # and nothing else in bin/ci does — a laptop without Docker must still be able to run
  # the full check suite, so this lives in bin/build-images rather than in bin/ci.
  #
  # It BUILDS AND SMOKE-TESTS, and deliberately does not push. This repo is public and
  # holds no cloud credential of any kind; publishing belongs to the private
  # infrastructure repo. Nothing here authenticates to anything.
  images:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    # Raised from 20 when `motet-enrich` joined the set (motet#102). That target is built on
    # Playwright's own base image — a ~1.5 GiB pull — installs the agent toolchain from npm,
    # and copies a Chromium. A hosted VM starts with no Docker layer cache, so every run is
    # the cold case this ceiling was sized for.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Build and smoke-test the container images
        # Tags itself per run and removes its own containers and images on the way out,
        # including on the failure path. The VM is discarded after the job, so nothing
        # here needs pruning.
        run: bin/build-images

  # Does this change touch the iOS app at all?
  #
  # macOS runners are the one expensive thing in this workflow — GitHub bills them at a
  # higher multiplier than Linux, and although this repo is public and therefore free, a
  # 10-minute Xcode build on every backend commit is gratuitous. So the iOS job below runs
  # only when `ios/**` (or this workflow) moved.
  #
  # This is a JOB rather than an `on: paths:` filter because `paths` is workflow-wide, and
  # `all-checks-pass` has to keep aggregating one workflow. A skipped job is already a
  # first-class outcome for that gate (see its comment), so gating the iOS job on this
  # output slots into the existing design rather than working around it.
  #
  # It has NO CHECKOUT — it asks the API which files moved instead of cloning them — for
  # the same reason `pr-auto-close.yml` has none: the cheapest way to be sure a job cannot
  # execute somebody else's code is for it to have no code of theirs to execute.
  #
  # On a pull request it asks about the WHOLE PR, not the last push. That is the property
  # that matters: a PR that touched `ios/**` and then added a docs-only commit still gets
  # the iOS job on its head commit, rather than merging an app nothing compiled because the
  # final commit happened to be prose.
  ios-changes:
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Read-only, and stated rather than inherited: this job asks the API a question and
    # writes nothing anywhere.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ios: ${{ steps.filter.outputs.ios }}
    steps:
      - name: Look for changes under ios/
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # `.files[]?` rather than `.files[]`: the compare endpoint omits `files` entirely
          # on a diff over 300 files, and iterating null would abort the job.
          if [ -n "${PR_NUMBER:-}" ]; then
            endpoint="repos/${REPO}/pulls/${PR_NUMBER}/files"; filter='.[].filename'
          elif [ -n "${BEFORE:-}" ] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            endpoint="repos/${REPO}/compare/${BEFORE}...${SHA}"; filter='.files[]?.filename'
          else
            endpoint=""
          fi

          # Every way of NOT getting an answer lands here, and the answer it gives is
          # "build". This job exists to save free minutes, so an unnecessary macOS run
          # costs nothing that matters — while a job that fails, or that guesses `false`,
          # either reddens the branch for a reason unrelated to the code or silently skips
          # the only compiler this app has. Fail towards building.
          #
          # An EMPTY result counts as not getting an answer too, which is the case the `?`
          # above would otherwise swallow in silence: `compare` drops `files` on a diff over
          # 300, so the biggest pushes — the ones most likely to touch `ios/**` — are exactly
          # the ones that would come back looking like they changed nothing at all.
          if [ -z "$endpoint" ] || ! files=$(gh api --paginate "$endpoint" --jq "$filter") \
             || [ -z "$files" ]; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
            echo "Could not determine the changed files; building the iOS app rather than guessing."
            exit 0
          fi

          printf '%s\n' "$files" | sed 's/^/  /'
          if printf '%s\n' "$files" | grep -qE '^(ios/|\.github/workflows/(ci|testflight|ios-ui-tests)\.yml$)'; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  # The iOS app, compiled by Xcode for the simulator.
  #
  # This is the one job on `macos-latest` rather than `ubuntu-latest`: `xcodebuild` needs a
  # Mac. GitHub's hosted macOS runners are free on a public repo, which is what makes an
  # unproven-until-now app buildable in CI with nobody having to own a Mac.
  #
  # NOTHING HERE SIGNS ANYTHING, and that is the property to preserve. A simulator build
  # and an unsigned device archive need no identity, no certificate, no provisioning profile
  # and no App Store Connect key, so this job holds no credential and needs no human in the
  # loop — which is the only reason it can run on every PR (AGENTS.md, invariant 9). Signing
  # and the TestFlight upload live in `testflight.yml`, behind a `main`-only environment; do
  # not add them here, and do not add `CODE_SIGN_ENTITLEMENTS`:
  # `ios/App/Motet/Motet.entitlements` asks for `com.apple.developer.carplay-audio`, which
  # Apple has not granted, and an ungranted entitlement makes a build fail to sign rather
  # than merely lack CarPlay.
  ios:
    if: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && needs.ios-changes.outputs.ios == 'true' }}
    needs: ios-changes
    runs-on: macos-latest
    # Raised from 45 when the simulator run joined the job: it is a second full app build
    # plus a boot and a two-test run on top of the three steps that were already here.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Report the toolchain
        # Which Xcode a hosted runner ships changes without notice, and a Swift-version
        # difference is the first thing to suspect when this job disagrees with a laptop.
        run: |
          xcodebuild -version
          swift --version
          ls /Applications | grep -i '^Xcode' || true

      - name: Build the app for the simulator
        # A script, not an inlined command, for the reason `bin/build-images` is a script:
        # a check that exists only in YAML cannot be run by hand and will rot. Anyone with
        # a Mac runs exactly this.
        run: ios/bin/build-app

      - name: Archive the app for a device, unsigned, and check it is uploadable in shape
        # The credential-free half of `testflight.yml`, run by the same script: the Release
        # configuration, the device SDK, the app icon and the Info.plist keys App Store
        # Connect reads. Without it the first place any of those is checked is an upload,
        # which needs the Apple key and a human to notice it failed.
        run: ios/bin/testflight check

      - name: Run the MotetKit tests against Apple's toolchain
        # The same script `bin/ci` calls on Linux — it picks up whichever Swift is on PATH,
        # which here is Xcode's. So this asserts nothing new about the logic and everything
        # about the *toolchain*: a difference from the Linux run is itself the finding. It
        # also builds `MotetPlayback` for macOS, the only place outside the app target that
        # a compiler is pointed at the AVFoundation half.
        run: ios/bin/ci-swift

      - name: Run the app on a simulator and check it produces audio
        # THE ONLY STEP IN THIS REPOSITORY THAT RUNS THE APP. Everything above it compiles,
        # archives or tests logic; none of that can answer "is sound actually coming out",
        # and neither can anything outside the process — no cloud device service captures
        # iOS audio. So the app measures itself (`PlaybackProbe`) and this reads it.
        #
        # It rides THIS job rather than living in a macOS job of its own, and that is the
        # cost decision: the runner is already up and Xcode is already warm, so what this
        # adds is a simulator boot plus one build-and-run — roughly 5 to 10 minutes on a
        # job that was already taking about that, rather than a second ~10-minute macOS
        # runner at its higher billing multiplier. It runs only when `ios/**` moved, like
        # everything else in this job.
        #
        # `Staging` with a base URL is deliberate: one run then proves both the staging
        # build variant resolves the server it was given AND that the playback signal
        # changes between playing and paused. The host is a reserved-by-RFC-2606 name that
        # can never resolve — the probe screen makes no request — because this repository
        # names no deployment of ours, not even in a workflow file.
        run: >
          ios/bin/ui-test
          --configuration Staging
          --api-base-url https://ui-test.invalid
          --artifacts "$RUNNER_TEMP/ui-test"

      - name: Keep what the run produced
        # `always()`: a red run is the one whose video, screenshot and result bundle
        # somebody needs, and nobody here has a Mac to reproduce it on.
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-ui-test
          path: ${{ runner.temp }}/ui-test
          retention-days: 14
          if-no-files-found: warn

  # Single aggregate gate. Set THIS job — `all-checks-pass` — as the one required status
  # check, rather than enumerating every job above.
  #
  # Three properties make it a correct gate:
  #   1. `if: ${{ !cancelled() }}` — it still runs when a dependency FAILS (a plain
  #      `needs:` job is skipped when a dependency fails, which would leave the required
  #      check stuck on "skipped" forever). `always()` would be wrong: this workflow sets
  #      `cancel-in-progress: true`, so every superseded run would execute this job, see
  #      `cancelled` among the results, and exit 1 — turning a cancelled run into a failed
  #      one. It deliberately carries no fork guard.
  #   2. It fails on any dependency that reported `failure` or `cancelled`.
  #   3. `skipped` dependencies neither fail it nor count as passes. The jobs above carry
  #      fork guards and report `skipped` on a fork PR, so a fork PR sees everything skip
  #      and this gate go green — the same tradeoff the guards already make. This job has
  #      no checkout step, so a fork PR never executes fork code here either. `ios` also
  #      skips on any change that does not touch `ios/**`, which is the same property being
  #      relied on a second time: a skipped job is a non-answer, not a pass.
  all-checks-pass:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - ci
      - images
      - ios-changes
      - ios
    steps:
      - name: Verify no required check failed or was cancelled
        run: |
          if ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}; then
            echo "::error::One or more required CI checks failed or were cancelled."
            echo "Results: ${{ join(needs.*.result, ', ') }}"
            exit 1
          fi
          echo "All required CI checks passed (skipped fork-guarded jobs are allowed)."
          echo "Results: ${{ join(needs.*.result, ', ') }}"
