# TEMPORARY — removed before the PR is marked ready. Takes simulator screenshots of the
# backlog's pick-and-generate UI via the Debug-only ScreenshotFixture. No credentials.
name: tmp-ios-screenshots
on:
  push:
    branches: [episode-from-selection]
permissions:
  contents: read
jobs:
  shots:
    if: ${{ github.repository == 'tadasant/motet' }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build for a simulator
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          c=[x for rt,v in d.items() if "iOS" in rt for x in v if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]]
          c=c or [x for rt,v in d.items() if "iOS" in rt for x in v if x["name"].startswith("iPhone")]
          print(c[-1]["udid"])')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl list devices | grep "$UDID"
          xcodebuild build -project ios/App/Motet.xcodeproj -scheme Motet -configuration Debug \
            -sdk iphonesimulator -destination "id=$UDID" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -quiet
      - name: Screenshot each scene
        run: |
          set -euo pipefail
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Motet.app
          mkdir -p shots
          for scene in backlog selecting generate generate-keep; do
            xcrun simctl terminate "$UDID" com.getmotet.app || true
            xcrun simctl launch "$UDID" com.getmotet.app -MotetScreenshot "$scene"
            sleep 12
            xcrun simctl io "$UDID" screenshot "shots/$scene.png"
          done
          ls -la shots
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: shots/
