  /v1/ingestion:
    get:
      description: "What has been ingested but is not in the backlog yet, and why.\n\nThe backlog answers\
        \ \"what do I have to listen to\"; it cannot answer \"where did the\nthing I just pasted go\"\
        , because an item that never integrates never becomes a news\nitem and so never appears there\
        \ at all. That gap is the whole reason this route\nexists: content that fails is content that\
        \ silently disappears.\n\nCovers both stages a thing can be stuck in on its way to the backlog,\
        \ which needed\nsaying because for a while it covered one. A pasted item has a ``source_items``\
        \ row\nfrom the moment it is accepted; a polled mailbox message does not get one until\nextraction\
        \ succeeds, so a message the fetch *raised* on \u2014 a revoked grant, a mailbox\nthat would not\
        \ answer \u2014 was reported nowhere at all while the poll cursor had already\nmoved past it (motet#35).\
        \ A message the extractor deliberately skips, because it is a\nreceipt rather than a newsletter,\
        \ is a different thing and is still not reported. Both\narms live in ``repo.list_ingestion``."
      operationId: list_ingestion_v1_ingestion_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/IngestionItemResponse'
                title: Response List Ingestion V1 Ingestion Get
                type: array
          description: Successful Response
        '422':
