  /v1/feed/rotate:
    post:
      description: "Revoke the current feed URL and mint a new one.\n\nThis unsubscribes every client\
        \ using the old URL, which is the point \u2014 it is the\nanswer to a leaked feed link, and there\
        \ is no other way to take one back."
      operationId: rotate_feed_v1_feed_rotate_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedInfoResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Rotate Feed
      tags:
      - feed
  /v1/news-items:
    get:
      description: 'The backlog: deduped news items with their read state (invariant 5).'
      operationId: list_news_items_v1_news_items_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NewsItemResponse'
                title: Response List News Items V1 News Items Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List News Items
      tags:
      - backlog
  /v1/news-items/{news_item_id}/read:
    post:
      description: 'Mark a news item read or unread.


        The same write that "I listened to this episode" performs, which is what invariant 5

        means in practice: one fact, one column, two ways of reaching it.'
      operationId: set_news_item_read_v1_news_items__news_item_id__read_post
      parameters:
      - in: path
        name: news_item_id
        required: true
        schema:
