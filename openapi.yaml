        id:
          title: Id
          type: string
        news_items:
          description: "Zero or one today \u2014 a source item belongs to at most one news item."
          items:
            $ref: '#/components/schemas/SourceItemNewsItemResponse'
          title: News Items
          type: array
        processed:
          $ref: '#/components/schemas/SourceItemProcessedStage'
        pulled:
          $ref: '#/components/schemas/SourceItemPulledStage'
        state:
          description: '''pending'', ''integrated'' or ''failed''.'
          title: State
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - state
      - pulled
      - processed
      - news_items
      title: SourceItemDetailResponse
      type: object
    SourceItemEnrichmentResponse:
      description: "PROTOTYPE \u2014 the agentic fetch of the full article, when triage asked for one."
      properties:
        enriched_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Enriched At
        error:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
        original_chars:
          anyOf:
          - type: integer
          - type: 'null'
          description: Length of the preview the article replaced; null until it did.
          title: Original Chars
        run:
          anyOf:
          - $ref: '#/components/schemas/EnrichRunResponse'
          - type: 'null'
          description: The newest run, once one has finished.
        status:
          description: '''pending'', ''running'', ''done'', ''failed'' or ''skipped''.'
          title: Status
          type: string
      required:
      - status
      - error
      - enriched_at
      - original_chars
      - run
      title: SourceItemEnrichmentResponse
      type: object
    SourceItemJobResponse:
      description: The newest ``integrate`` job for a source item, as the queue holds it.
      properties:
        attempts:
          title: Attempts
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: integer
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        locked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When a worker last touched its lease.
          title: Locked At
        max_attempts:
          description: The ceiling the queue counts to.
          title: Max Attempts
          type: integer
        run_at:
          description: When the job is (or was) due.
          format: date-time
          title: Run At
          type: string
        state:
          description: '''ready'', ''running'', ''done'' or ''failed''.'
          title: State
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        work_committed:
          description: Whether the handler's work landed durably (the work fence), even if the job row
            has not been completed yet.
          title: Work Committed
          type: boolean
      required:
      - id
      - state
      - attempts
      - max_attempts
      - run_at
      - locked_at
      - created_at
      - updated_at
      - last_error
      - work_committed
      title: SourceItemJobResponse
      type: object
    SourceItemNewsItemResponse:
      description: 'Stage 3: the deduped news item this source item feeds.'
      properties:
        id:
          title: Id
          type: string
        position:
          description: This source item's position among them; 0 created it.
          title: Position
          type: integer
        read:
          title: Read
          type: boolean
        source_count:
          description: How many source items back this story.
          title: Source Count
          type: integer
        summary:
          title: Summary
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - summary
      - read
      - source_count
      - position
      title: SourceItemNewsItemResponse
      type: object
    SourceItemProcessedStage:
      description: "Stage 2: what processing did with the item \u2014 and, as often, what it has not done.\n\
        \nRendered as an explicit stage even when empty, because this is where enrichment steps\nwill\
        \ be added between the scrape and the news item. ``status`` is derived from the\nsource item's\
        \ state and the newest job's: ``held`` means nobody has asked for\ninference yet; ``queued``,\
        \ ``running`` and ``failed`` follow the job; ``done`` means\nthe item is integrated."
      properties:
        cost_recorded:
          description: 'Whether this item''s inference spend is persisted. Always false today: usage is
            logged per item and metered per stage, never stored on the row.'
          title: Cost Recorded
          type: boolean
        decision_recorded:
          description: 'Whether dedup''s relation / reason / closest candidate are persisted. Always false
            today: they are logged and counted, never stored.'
          title: Decision Recorded
          type: boolean
        enrich:
          anyOf:
          - $ref: '#/components/schemas/SourceItemEnrichmentResponse'
          - type: 'null'
          description: "PROTOTYPE \u2014 null unless triage decided to fetch the article."
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: The source item's recorded error, or the job's last one while retrying.
          title: Error
        integrated_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Integrated At
        job:
          anyOf:
          - $ref: '#/components/schemas/SourceItemJobResponse'
          - type: 'null'
        outcome:
          anyOf:
          - type: string
          - type: 'null'
          description: '''new'' if this source item created its news item, ''merged'' if it was folded
            into one that already existed; null until integrated. Read off news_item_sources.position,
            which is the only durable trace of the decision.'
          title: Outcome
        status:
          description: '''held'', ''queued'', ''enriching'', ''running'', ''done'' or ''failed''.'
          title: Status
          type: string
        summary:
          anyOf:
          - type: string
          - type: 'null'
          description: Likewise the summary.
          title: Summary
        title:
          anyOf:
          - type: string
          - type: 'null'
          description: "The news item's title as it stands now \u2014 dedup wrote or rewrote it."
          title: Title
        triage:
          anyOf:
          - $ref: '#/components/schemas/SourceItemTriageResponse'
          - type: 'null'
          description: "PROTOTYPE \u2014 null until the integrate job has run triage."
      required:
      - status
      - job
      - triage
      - enrich
      - integrated_at
      - error
      - outcome
      - title
      - summary
      - decision_recorded
      - cost_recorded
      title: SourceItemProcessedStage
      type: object
    SourceItemPulledStage:
      description: "Stage 1 of a source item's life: what the deterministic scrape pulled in.\n\nEverything\
        \ here was produced without a model \u2014 a poll, a fetch, and\n``motet_sources.extract``. ``text``\
        \ is the extracted text, not the raw message: the\nRFC 822 bytes are never stored, which ``raw_stored``\
        \ says out loud so that the UI does\nnot call the extracted text \"the email\"."
      properties:
        chars:
          description: Length of the extracted text.
          title: Chars
          type: integer
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The provider's own id for the message; null for a paste.
          title: External Id
        raw_stored:
          description: Whether the raw bytes the text was extracted from are kept. Always false.
          title: Raw Stored
          type: boolean
        received_at:
          description: When the source item was stored.
          format: date-time
          title: Received At
          type: string
        source_id:
          title: Source Id
          type: string
        source_kind:
          description: '''gmail'' or ''paste''.'
          title: Source Kind
          type: string
        source_name:
          title: Source Name
          type: string
        text:
          description: The extracted text, in full.
          title: Text
          type: string
      required:
      - source_id
      - source_kind
      - source_name
      - external_id
      - received_at
      - chars
      - text
      - raw_stored
      title: SourceItemPulledStage
      type: object
    SourceItemResponse:
      properties:
        id:
          title: Id
          type: string
        state:
          description: '''pending'' until a worker integrates it, then ''integrated'' or ''failed''.'
          title: State
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - state
      title: SourceItemResponse
      type: object
    SourceItemTriageResponse:
      description: "PROTOTYPE \u2014 what triage decided about the item, before dedup."
      properties:
        article_url:
          anyOf:
          - type: string
          - type: 'null'
          description: Where the full article lives, for 'fetch'.
          title: Article Url
        decision:
          description: '''raw'' (the text is the content) or ''fetch'' (a preview).'
          title: Decision
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      required:
      - decision
      - reason
      - article_url
      title: SourceItemTriageResponse
      type: object
    SourceResponse:
      description: "A place source items come from \u2014 pasted text, or a connected mailbox."
      properties:
        active:
          description: 'False means connected but paused: it is not polled, and nothing is lost.'
          title: Active
          type: boolean
        connected:
          description: "Whether a credential is stored for this source. Answered without decrypting anything\
            \ \u2014 only workers can do that (invariant 8)."
          title: Connected
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        kind:
          description: '''paste'' or ''gmail''.'
          title: Kind
          type: string
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        last_polled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Polled At
        name:
          title: Name
          type: string
        scopes:
          description: OAuth scopes actually granted, which may be more than were asked for.
          items:
            type: string
          title: Scopes
          type: array
      required:
      - id
      - kind
      - name
      - active
      - connected
      - scopes
      - last_polled_at
      - last_error
      - created_at
      title: SourceResponse
      type: object
    SourceSpanModel:
      description: "A half-open character range in a source item \u2014 what makes a claim checkable."
      properties:
        end:
          title: End
          type: integer
        source_item_id:
          title: Source Item Id
          type: string
        start:
          title: Start
          type: integer
      required:
      - source_item_id
      - start
      - end
      title: SourceSpanModel
      type: object
    StartLoginRequest:
      description: Begin a Google sign-in. Answered with a URL for the browser to visit.
      properties:
        redirect_uri:
          description: "Where Google sends the browser back to \u2014 this deployment's SPA origin plus\
            \ /oauth/callback. Supplied by the client for the same reason connecting a mailbox supplies\
            \ it: one bundle serves three environments, each with its own origin. It must be registered\
            \ on the OAuth client, and when MOTET_APP_BASE_URL is set the API additionally requires it\
            \ to match."
          minLength: 1
          title: Redirect Uri
          type: string
      required:
      - redirect_uri
      title: StartLoginRequest
      type: object
    StartLoginResponse:
      description: Where to send the browser, and the state that identifies this sign-in.
      properties:
        authorization_url:
          title: Authorization Url
          type: string
        state:
          description: The CSRF token for this sign-in. Returned so a client can verify the callback it
            receives is the one it started, and prefixed 'login.' so the single /oauth/callback path can
            tell a sign-in from a mailbox connection.
          title: State
          type: string
      required:
      - authorization_url
      - state
      title: StartLoginResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  description: 'Motet turns a reading backlog into an interactive podcast.


    This document is generated from the FastAPI app and committed as `openapi.yaml`; the TypeScript client
    is generated from it in turn. Do not hand-edit either.'
  title: Motet API
  version: 0.1.0
openapi: 3.1.0
paths:
  /feed.xml:
    get:
      description: 'The private, authenticated RSS feed Phase 1 ships instead of a player.


        RSS buys background audio, offline, lockscreen, CarPlay, and speed control with zero

        iOS code. Audio is served from object storage behind signed URLs, so this document

        carries links, never bytes.'
      operationId: rss_feed_feed_xml_get
      parameters:
      - description: The feed's secret, from GET /v1/feed.
        in: query
        name: token
        required: false
        schema:
          default: ''
          description: The feed's secret, from GET /v1/feed.
          title: Token
          type: string
      responses:
        '200':
          content:
            application/rss+xml: {}
          description: The RSS feed
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Rss Feed
      tags:
      - feed
  /internal/health:
    get:
      description: "Liveness, plus whether telemetry and authentication are actually wired.\n\nThe flags\
        \ are not decoration. Exporters no-op silently when unconfigured, so without\nthis an unmonitored\
        \ process is indistinguishable from a quiet one \u2014 and an\nunauthenticated deployment is indistinguishable\
        \ from a working one until the bill\narrives.\n\n**\"internal\" in the path names an owned namespace,\
        \ not a network boundary.** This\nroute is unauthenticated and reachable by anyone who can reach\
        \ the service \u2014 which is\nthe point, since the whole reason motet#16 mattered is that health\
        \ has to be askable\nfrom outside. Nothing secret goes in the response; a new field here is public."
      operationId: health_internal_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Health
      tags:
      - ops
  /v1/admin/llm-config:
    get:
      description: Every LLM stage's resolved model and effort, and where each came from.
      operationId: get_llm_config_v1_admin_llm_config_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmConfigResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Llm Config
      tags:
      - admin
  /v1/admin/llm-config/{stage}:
    put:
      description: 'Set or clear one stage''s settings-table overrides, then return the whole config.


        The candidate rows are resolved *before* they are written, through the same

        ``load_config`` the worker will run: an unknown slug, an effort the slug does not

        accept, or an effort on a model with none is a 400 with the resolver''s own message.'
      operationId: put_llm_config_v1_admin_llm_config__stage__put
      parameters:
      - in: path
        name: stage
        required: true
        schema:
          title: Stage
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmStageConfigUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmConfigResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Put Llm Config
      tags:
      - admin
  /v1/admin/overview:
    get:
      description: 'The whole deployment at a glance, across every user.


        Deployment state rather than user state, like ``/v1/processing``: the caller''s own

        ``user_id`` is ignored, and the route takes it only to sit behind the same lock as

        everything else under ``/v1``. The optional ``user_id`` query filters the job list;

        the per-user and per-queue aggregates are always for everyone.'
      operationId: admin_overview_v1_admin_overview_get
      parameters:
      - in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Admin Overview
      tags:
      - admin
  /v1/auth/google/callback:
    post:
      description: "Finish a sign-in: verify the ID token, check the allowlist, mint a session.\n\nThe\
        \ order is the point. The identity is established first and completely \u2014 signature\nagainst\
        \ Google's JWKS, audience, issuer, expiry, nonce, and ``email_verified`` \u2014 and\nonly then\
        \ is the address compared against ``MOTET_ALLOWED_EMAILS``. An email claim out\nof an unverified\
        \ token is a string somebody typed, and authorizing on one would be the\nwhole vulnerability this\
        \ route exists to avoid.\n\nThe state is consumed exactly once by a ``DELETE ... RETURNING``,\
        \ so a replayed\ncallback finds nothing rather than racing a concurrent one into two sessions."
      operationId: complete_login_v1_auth_google_callback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Complete Login
      tags:
      - auth
  /v1/auth/google/start:
    post:
      description: "Begin a sign-in: record the pending authorization and return a consent URL.\n\nThe\
        \ state and the PKCE verifier are stored rather than derived, for the same reason\nconnecting\
        \ a mailbox stores them \u2014 a callback that validated a state it recomputed\nfrom its own parameters\
        \ would defend against nothing. The OIDC ``nonce`` goes in the\nsame row: it travels out in the\
        \ request and comes back inside the signed ID token, so\nchecking it means remembering what was\
        \ sent.\n\nRefused before anything is written when no allowlist is configured. Sending someone\n\
        through Google's consent screen only to deny them afterwards is a worse answer than\nsaying the\
        \ deployment cannot do this yet."
      operationId: start_login_v1_auth_google_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Login
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: "Revoke this browser's session.\n\nA no-op for the shared API token, which is not a\
        \ session and cannot be revoked by a\nrequest \u2014 rotating it is a deploy. Answering 204 either\
        \ way is what lets a client sign\nout without first working out which kind of token it holds."
      operationId: logout_v1_auth_logout_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Logout
      tags:
      - auth
  /v1/auth/logout-all:
    post:
      description: "Revoke every session, including this one. The answer to a lost phone.\n\nIt exists\
        \ because the alternative is not an operation. `/v1/auth/logout` needs the\nvery token you are\
        \ trying to revoke, and invariant 10 says nobody has a shell to run\na `DELETE` from \u2014 so\
        \ without this, \"I left my laptop on a train\" would mean waiting\nout a thirty-day expiry, or\
        \ taking your own address off `MOTET_ALLOWED_EMAILS` and\nredeploying twice.\n\nReachable with\
        \ the shared API token as well as with a session, which is what makes it\nusable from a *different*\
        \ device than the compromised one."
      operationId: logout_everywhere_v1_auth_logout_all_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Logout Everywhere
      tags:
      - auth
  /v1/auth/session:
    get:
      description: "Who this request is, and how it proved it.\n\nAnswers for the shared API token too,\
        \ so the SPA can say \"signed in as \u2026\" or \"using an\nAPI token\" from what the *server*\
        \ believes rather than by inferring it from what it\nhappens to have in storage."
      operationId: current_session_v1_auth_session_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Current Session
      tags:
      - auth
  /v1/connectors:
    get:
      operationId: list_connectors_v1_connectors_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConnectorResponse'
                title: Response List Connectors V1 Connectors Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Connectors
      tags:
      - connectors
    post:
      operationId: create_connector_v1_connectors_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectorRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Connector
      tags:
      - connectors
  /v1/connectors/oauth/callback:
    post:
      description: 'Exchange the code, seal the token set onto the connector, mark it ready.


        The token set exists as a local variable and nowhere else; it is sealed under

        ``user_id:connector_id:mcp`` and the API cannot read it back.'
      operationId: connector_oauth_callback_v1_connectors_oauth_callback_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorOAuthCallbackRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResponse'
          description: Successful Response
