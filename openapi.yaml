  /v1/episodes/{episode_id}/progress:
    post:
      description: "Record how far the listener has got, and mark what they have passed as read.\n\n**This\
        \ is how the audio surface participates in invariant 5.** Phase 1 only had the\nvisual side plus\
        \ an all-or-nothing \"mark listened\"; this makes partial listening count.\nA story is read once\
        \ its segment has been *passed* \u2014 the comparison is against the end\nof the segment, because\
        \ marking at the start would tick a story off on its first word.\n\nPosition is monotonic on the\
        \ server (invariant 4: we own it). A client that seeks\nbackwards is reviewing, not un-listening,\
