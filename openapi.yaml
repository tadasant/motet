    SmartRuleModel:
      description: "Filter, window, duration, ranking \u2014 how a smart episode chooses its stories.\n\
        \nDuration is deliberately absent: it is ``max_duration_ms`` on the episode itself. Two\ncopies\
        \ of a cap is one too many, and the stale one is the one somebody would trust."
      properties:
        max_items:
          default: 100
          maximum: 100.0
          minimum: 1.0
          title: Max Items
          type: integer
        ranking:
          default: oldest_first
          description: "oldest_first (drains a backlog), newest_first (a morning briefing), or coverage\
            \ (most independently reported first). All three are computed from the rows \u2014 ranking\
            \ with a model is Phase 3."
          title: Ranking
          type: string
        source_ids:
          description: Only stories backed by these sources. Empty means every source.
          items:
            type: string
          title: Source Ids
          type: array
        unread_only:
          default: true
          description: Skip stories already read. Off for a 'catch me up' rule.
          title: Unread Only
          type: boolean
        window_days:
          default: 2
          description: How far back to reach. 0 means no window, which is what manual does.
          maximum: 30.0
          minimum: 0.0
          title: Window Days
          type: integer
      title: SmartRuleModel
      type: object
    SourceItemDetailResponse:
      description: 'One source item across its three stages: pulled in, processed, news item.


        A read over ``source_items``, the newest ``integrate`` job and ``news_item_sources``.

        ``processed`` is a list so that enrichment steps can join dedup without a new shape;

        it is empty while the item is held or once it is dismissed, and ``news_items`` is

        empty until dedup has run.'
      properties:
        id:
          title: Id
          type: string
        news_items:
          description: "Zero or one today \u2014 a source item belongs to at most one news item."
          items:
            $ref: '#/components/schemas/SourceItemNewsItemResponse'
          title: News Items
          type: array
        processed:
          items:
            $ref: '#/components/schemas/ProcessingStepResponse'
          title: Processed
          type: array
        pulled:
          $ref: '#/components/schemas/SourceItemPulledStage'
        state:
          description: '''pending'', ''integrated'', ''failed'' or ''dismissed''.'
          title: State
          type: string
        status:
          description: '''held'' (pending, nobody has asked for inference), ''enriching'' (an agent is
            fetching the full article), ''queued'', ''running'', ''done'', ''failed'' or ''dismissed''.'
          title: Status
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - state
      - status
      - pulled
      - processed
      - news_items
      title: SourceItemDetailResponse
      type: object
    SourceItemIdsRequest:
      description: Which held source items to act on. At most as many as the held list returns.
      properties:
        ids:
          items:
            type: string
          maxItems: 500
          minItems: 1
          title: Ids
          type: array
      required:
      - ids
      title: SourceItemIdsRequest
      type: object
    SourceItemJobResponse:
      description: The newest ``integrate`` job for a source item, as the queue holds it.
      properties:
        attempts:
          title: Attempts
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: integer
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        locked_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When a worker last touched its lease.
          title: Locked At
        max_attempts:
          description: The ceiling the queue counts to.
          title: Max Attempts
          type: integer
        run_at:
          description: When the job is (or was) due.
          format: date-time
          title: Run At
          type: string
        state:
          description: '''ready'', ''running'', ''done'' or ''failed''.'
          title: State
          type: string
        updated_at:
          format: date-time
          title: Updated At
          type: string
        work_committed:
          description: Whether the handler's work landed durably (the work fence), even if the job row
            has not been completed yet.
          title: Work Committed
          type: boolean
      required:
      - id
      - state
      - attempts
      - max_attempts
      - run_at
      - locked_at
      - created_at
      - updated_at
      - last_error
      - work_committed
      title: SourceItemJobResponse
      type: object
    SourceItemNewsItemResponse:
      description: 'Stage 3: the deduped news item this source item feeds.'
      properties:
        id:
          title: Id
          type: string
        position:
          description: This source item's position among them; 0 created it.
          title: Position
          type: integer
        read:
          title: Read
          type: boolean
        source_count:
          description: How many source items back this story.
          title: Source Count
          type: integer
        summary:
          title: Summary
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - summary
      - read
      - source_count
      - position
      title: SourceItemNewsItemResponse
      type: object
    SourceItemPulledStage:
      description: "Stage 1 of a source item's life: what the deterministic scrape pulled in.\n\nEverything\
        \ here was produced without a model \u2014 a poll, a fetch, and\n``motet_sources.extract``. ``text``\
        \ is the extracted text, not the raw message: the\nRFC 822 bytes are never stored, which ``raw_stored``\
        \ says out loud so that the UI does\nnot call the extracted text \"the email\"."
      properties:
        chars:
          description: Length of the extracted text.
          title: Chars
          type: integer
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The provider's own id for the message; null for a paste.
          title: External Id
        raw_stored:
          description: Whether the raw bytes the text was extracted from are kept. Always false.
          title: Raw Stored
          type: boolean
        received_at:
          description: When the message says it was sent; see HeldSourceItemResponse.
          format: date-time
          title: Received At
          type: string
        source_id:
          title: Source Id
          type: string
        source_kind:
          description: '''gmail'' or ''paste''.'
          title: Source Kind
          type: string
        source_name:
          title: Source Name
          type: string
        stored_at:
          description: When the source item row was written.
          format: date-time
          title: Stored At
          type: string
        text:
          description: The extracted text, in full.
          title: Text
          type: string
      required:
      - source_id
      - source_kind
      - source_name
      - external_id
      - received_at
      - stored_at
      - chars
      - text
      - raw_stored
      title: SourceItemPulledStage
      type: object
    SourceItemResponse:
      properties:
        id:
          title: Id
          type: string
        state:
          description: '''pending'' until a worker integrates it, then ''integrated'' or ''failed''.'
          title: State
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - state
      title: SourceItemResponse
      type: object
    SourceResponse:
      description: "A place source items come from \u2014 pasted text, or a connected mailbox.\n\n**Two\
        \ rows with no credential mean different things, and ``disconnected_at`` is what\ntells them apart.**\
        \ ``POST /v1/sources/connect`` creates a row before the user leaves\nfor the provider, so a consent\
        \ that was cancelled leaves one behind that never held a\ncredential. A mailbox that was disconnected\
        \ held one and gave it back. Both are\n``connected: false, active: false``. A row disconnected\
        \ before ``disconnected_at``\nexisted has it null, and its ``last_polled_at`` is the only tell."
      properties:
        active:
          description: 'False means connected but paused: it is not polled, and nothing is lost.'
          title: Active
          type: boolean
        configured_first_sync_days:
          anyOf:
          - type: integer
          - type: 'null'
          description: "The window a first sync would use for this source from now on, as chosen when\
            \ it was connected or by a later 'sync further back'. Null means nobody chose one and the\
            \ deployment's own default applies \u2014 which the worker resolves, not this service, so\
            \ it is deliberately not guessed at here. Distinct from `first_sync_days`, which is what the\
            \ last first sync actually reached."
          title: Configured First Sync Days
        connected:
          description: "Whether a credential is stored for this source. Answered without decrypting anything\
            \ \u2014 only workers can do that (invariant 8)."
          title: Connected
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        disconnected_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the credential was forgotten through the disconnect route. Null for a source
            that is connected, was never connected, or was disconnected before this was recorded.
          title: Disconnected At
        first_sync_days:
          anyOf:
          - type: integer
          - type: 'null'
          description: How many days back this source's most recent first sync reached. A first sync reads
            only that window, so older matching mail is not ingested. Null until a first sync has run.
          title: First Sync Days
        id:
          title: Id
          type: string
        items_integrated:
          description: Of those, how many have been integrated into a news item, all time.
          title: Items Integrated
          type: integer
        items_pulled_in:
          description: Source items this source has produced, all time, in any state.
          title: Items Pulled In
          type: integer
        kind:
          description: '''paste'' or ''gmail''.'
          title: Kind
          type: string
        label_sync:
          anyOf:
          - $ref: '#/components/schemas/LabelSyncResponse'
          - type: 'null'
          description: Moving a message between Gmail labels when its owner ingests it (motet#96). null
            for any source that is not a mailbox.
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        last_polled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Polled At
        last_sync:
          anyOf:
          - $ref: '#/components/schemas/SourceSyncResult'
          - type: 'null'
          description: The most recent poll's result. Null until one has run.
        name:
          title: Name
          type: string
        query:
          anyOf:
          - type: string
          - type: 'null'
          description: "The search this source is polled with \u2014 its own, or the default when it has\
            \ none \u2014 applied on every poll, not only the first. Null for a source that is not polled."
          title: Query
        scopes:
          description: OAuth scopes actually granted, which may be more than were asked for.
          items:
            type: string
          title: Scopes
          type: array
        sync_progress:
          anyOf:
          - $ref: '#/components/schemas/SourceSyncProgress'
          - type: 'null'
          description: Where a sync in flight has got to, or how the latest one ended for an hour after.
            Null when no sync is running or recent, and for a source nothing polls.
      required:
      - id
      - kind
      - name
      - active
      - connected
      - scopes
      - last_polled_at
      - last_error
      - created_at
      - query
      - first_sync_days
      - last_sync
      - disconnected_at
      - items_pulled_in
      - items_integrated
      title: SourceResponse
      type: object
    SourceSpanModel:
      description: "A half-open character range in a source item \u2014 what makes a claim checkable."
      properties:
        end:
          title: End
          type: integer
        source_item_id:
          title: Source Item Id
          type: string
        start:
          title: Start
          type: integer
      required:
      - source_item_id
      - start
      - end
      title: SourceSpanModel
      type: object
    SourceSyncProgress:
      description: "Where a mailbox sync is right now, from \"Sync now\" to the last message extracted.\n\
        \nA sync is a chain of polls, each listing a bounded slice of the search and queueing\nwhat is\
        \ new for extraction (motet#94), so a large first sync is many jobs over minutes.\nThis is that\
        \ chain added up and joined to the job queue, so a screen can show which\nstep it is on and how\
        \ far through it is instead of a bare \"Syncing\u2026\".\n\n``stage`` is the one field to branch\
        \ on:\n\n- ``queued`` \u2014 a poll is waiting for a worker to pick it up.\n- ``retrying`` \u2014\
        \ a poll failed and is waiting to try again; ``error`` says why.\n- ``connecting`` \u2014 a worker\
        \ has the poll and is reaching the mailbox; nothing listed yet.\n- ``listing`` \u2014 paging through\
        \ the search. ``found`` is a lower bound until it ends.\n- ``fetching`` \u2014 the search is exhausted;\
        \ ``found`` is final and messages are still\n  being fetched and extracted.\n- ``done`` \u2014\
        \ every message found has been through extraction. Reported for an hour.\n- ``failed`` \u2014\
        \ the sync gave up; ``error`` says why. Reported for an hour.\n\nCounts are of messages this sync\
        \ found that were **new to Motet**, not of everything the\nsearch matched (that is ``listed``).\
        \ ``pulled_in`` is found messages that have been\nthrough extraction \u2014 including a receipt\
        \ it read and skipped as not a newsletter \u2014 so\nit is progress through the work rather than\
        \ a count of items held for you."
      properties:
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the sync gave up (``failed``) or why its poll is retrying, else null.
          title: Error
        failed:
          description: Found messages whose extraction gave up after its retries.
          title: Failed
          type: integer
        found:
          description: Of those, messages new to Motet, queued for extraction.
          title: Found
          type: integer
        found_is_lower_bound:
          description: True while the search still has pages to list, so more may be found. Say 'at least'
            beside ``found`` when it is.
          title: Found Is Lower Bound
          type: boolean
        listed:
          description: Messages matching the filter the search has listed so far, new or not.
          title: Listed
          type: integer
        pages:
          description: Search result pages read so far.
          title: Pages
          type: integer
        pulled_in:
          description: Found messages that have been through extraction, skipped ones included.
          title: Pulled In
          type: integer
        remaining:
          description: Found messages still waiting to be fetched and extracted, or in flight.
          title: Remaining
          type: integer
        stage:
          enum:
          - queued
          - retrying
          - connecting
          - listing
          - fetching
          - done
          - failed
          title: Stage
          type: string
        started_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When this sync's first poll ran. Null while the first poll is still queued.
          title: Started At
        waiting_on_worker:
          description: "True when work is waiting, no worker has run in the last five minutes, none is\
            \ running any of it, and none is being started \u2014 so nothing will move until one runs.\
            \ A queued sync that is merely waiting its turn is false, and so is one whose worker is still\
            \ booting: that is ``worker_starting``."
          title: Waiting On Worker
          type: boolean
        worker_starting:
          default: false
          description: "True when a worker was asked for and may still be starting: this deployment runs\
            \ the worker on demand, and the container takes a minute or two to appear. Mutually exclusive\
            \ with ``waiting_on_worker`` \u2014 say 'a worker is starting' rather than 'nothing will run\
            \ this'. Optional so an older client decodes."
          title: Worker Starting
          type: boolean
      required:
      - stage
      - started_at
      - listed
      - found
      - found_is_lower_bound
      - pulled_in
      - remaining
      - failed
      - pages
      - error
      - waiting_on_worker
      title: SourceSyncProgress
      type: object
    SourceSyncResult:
      description: "What the most recent poll of a connected source found \u2014 or why it gave up."
      properties:
        at:
          description: When that poll finished, or gave up.
          format: date-time
          title: At
          type: string
        caught_up:
          description: "False while the search has matching messages left to list \u2014 a first sync\
            \ of a large backlog takes several polls, and each one queues the next. True once the search\
            \ is exhausted and only new mail is left to find."
          title: Caught Up
          type: boolean
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the poll gave up after its retries, or null. A poll still being retried is
            not reported here.
          title: Error
        queued:
          description: Messages new to Motet that it queued for extraction.
          title: Queued
          type: integer
        seen:
          description: Messages it listed that match the source's filter, including ones already ingested.
            Zero for a poll that gave up.
          title: Seen
          type: integer
      required:
      - at
      - seen
      - queued
      - caught_up
      - error
      title: SourceSyncResult
      type: object
    StartLoginRequest:
      description: Begin a Google sign-in. Answered with a URL for the browser to visit.
      properties:
        redirect_uri:
          description: "Where Google sends the browser back to \u2014 this deployment's SPA origin plus\
            \ /oauth/callback. Supplied by the client for the same reason connecting a mailbox supplies\
            \ it: one bundle serves three environments, each with its own origin. It must be registered\
            \ on the OAuth client, and when MOTET_APP_BASE_URL is set the API additionally requires it\
            \ to match."
          minLength: 1
          title: Redirect Uri
          type: string
      required:
      - redirect_uri
      title: StartLoginRequest
      type: object
    StartLoginResponse:
      description: Where to send the browser, and the state that identifies this sign-in.
      properties:
        authorization_url:
          title: Authorization Url
          type: string
        state:
          description: The CSRF token for this sign-in. Returned so a client can verify the callback it
            receives is the one it started, and prefixed 'login.' so the single /oauth/callback path can
            tell a sign-in from a mailbox connection.
          title: State
          type: string
      required:
      - authorization_url
      - state
      title: StartLoginResponse
      type: object
    StartNativeLoginRequest:
      description: Begin a Google sign-in on behalf of the iOS app.
      properties:
        app_link_domain:
          anyOf:
          - maxLength: 253
            type: string
          - type: 'null'
          description: "The host this build may receive an https sign-in handoff on \u2014 the associated\
            \ domain its entitlement names \u2014 or null where it can only receive callback_scheme. Sent\
            \ rather than inferred because only the app knows whether its build carries the entitlement\
            \ and whether its iOS is new enough to wait for an https callback; an https handoff to an\
            \ app watching for the scheme would leave the sign-in sheet open forever."
          title: App Link Domain
        code_challenge:
          description: base64url(SHA-256(code_verifier)) without padding (RFC 7636 S256). The verifier
            stays in the app and is presented only when the handoff is redeemed.
          pattern: ^[A-Za-z0-9_-]{43}$
          title: Code Challenge
          type: string
      required:
      - code_challenge
      title: StartNativeLoginRequest
      type: object
    StartNativeLoginResponse:
      description: Where the app's in-app browser should go.
      properties:
        authorization_url:
          description: Google's consent URL. It returns to this deployment's web app, which finishes the
            sign-in and then navigates to a motet:// link.
          title: Authorization Url
          type: string
        callback_host:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Set when the handoff will come back on an https link rather than on callback_scheme:
            the host of that link. Only ever the host the caller asked for in app_link_domain, and only
            when this deployment serves an Apple app-site-association file naming the app. Absent means
            use callback_scheme.'
          title: Callback Host
        callback_path:
          anyOf:
          - type: string
          - type: 'null'
          description: The path of that https handoff link. Absent with callback_host.
          title: Callback Path
        callback_scheme:
          description: The URL scheme the sign-in sheet should wait for, and the one the handoff link
            uses unless callback_host is set.
          title: Callback Scheme
          type: string
      required:
      - authorization_url
      - callback_scheme
      title: StartNativeLoginResponse
      type: object
    StartVoiceSessionRequest:
      properties:
        spoken_through_ms:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          description: 'Where the listener''s player is. The session''s clock starts here (invariant 4:
            the position is ours, reported by the client''s player). Omitted means the episode''s own
            listened_through_ms.'
          title: Spoken Through Ms
      title: StartVoiceSessionRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VoiceSessionResponse:
      description: What a client needs to open the voice socket, and nothing about the vendor behind it.
      properties:
        arm:
          description: Which arm answers. Informational; never branched on.
          title: Arm
          type: string
        authenticate_frame:
          additionalProperties: true
          description: Send this, verbatim and as the first frame, once the socket opens. It carries the
            session config the token was signed over; the voice service checks the two match, so it must
            not be altered.
          title: Authenticate Frame
          type: object
        conversational:
          title: Conversational
          type: boolean
        expires_at:
          title: Expires At
          type: string
        session_id:
          title: Session Id
          type: string
        session_token:
          title: Session Token
          type: string
        websocket_url:
          description: The socket to open, ws:// or wss://.
          title: Websocket Url
          type: string
      required:
      - session_id
      - session_token
      - expires_at
      - websocket_url
      - arm
      - conversational
      - authenticate_frame
      title: VoiceSessionResponse
      type: object
    VoiceStatusResponse:
      description: "Whether Play Live can run here \u2014 asked before a button is offered."
      properties:
        configured:
          description: Whether this deployment can mint a voice session. False means no voice service
            is configured, and the client should not offer Play Live.
          title: Configured
          type: boolean
        reason:
          anyOf:
          - type: string
          - type: 'null'
          description: Why not, as a sentence to show. Null when configured.
          title: Reason
      required:
      - configured
      title: VoiceStatusResponse
      type: object
    WaitlistJoinResponse:
      description: 'The landing page''s waitlist form was accepted.


        The same answer whether the address is new or already listed, so the route cannot be

        used to learn who is on the list.'
      properties:
        status:
          const: joined
          title: Status
          type: string
      required:
      - status
      title: WaitlistJoinResponse
      type: object
info:
  description: 'Motet turns a reading backlog into an interactive podcast.


    This document is generated from the FastAPI app and committed as `openapi.yaml`; the TypeScript client
    is generated from it in turn. Do not hand-edit either.'
  title: Motet API
  version: 0.1.0
openapi: 3.1.0
paths:
  /feed.xml:
    get:
      description: 'The private, authenticated RSS feed Phase 1 ships instead of a player.


        RSS buys background audio, offline, lockscreen, CarPlay, and speed control with zero

        iOS code. Audio is served from object storage behind signed URLs, so this document

        carries links, never bytes.'
      operationId: rss_feed_feed_xml_get
      parameters:
      - description: The feed's secret, from GET /v1/feed.
        in: query
        name: token
        required: false
        schema:
          default: ''
          description: The feed's secret, from GET /v1/feed.
          title: Token
          type: string
      responses:
        '200':
          content:
            application/rss+xml: {}
          description: The RSS feed
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Rss Feed
      tags:
      - feed
  /internal/health:
    get:
      description: "Liveness, plus whether telemetry and authentication are actually wired.\n\nThe flags\
        \ are not decoration. Exporters no-op silently when unconfigured, so without\nthis an unmonitored\
        \ process is indistinguishable from a quiet one \u2014 and an\nunauthenticated deployment is indistinguishable\
        \ from a working one until the bill\narrives.\n\n**\"internal\" in the path names an owned namespace,\
        \ not a network boundary.** This\nroute is unauthenticated and reachable by anyone who can reach\
        \ the service \u2014 which is\nthe point, since the whole reason motet#16 mattered is that health\
        \ has to be askable\nfrom outside. Nothing secret goes in the response; a new field here is public."
      operationId: health_internal_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Health
      tags:
      - ops
  /v1/admin/llm-config:
    get:
      description: 'Every LLM stage''s resolved model and effort, where each came from, and the catalogue.


        Where settings are not writable the rows are neither read nor shown: the answer is the

        environment''s, which is what every job on this deployment runs.'
      operationId: get_llm_config_v1_admin_llm_config_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmConfigResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Llm Config
      tags:
      - admin
  /v1/admin/llm-config/{stage}:
    put:
      description: 'Set or clear one stage''s model and effort. Applies to the next job a worker claims.


        Validated before anything is written, by the same function the worker applies rows

        through: an unknown slug, an effort the slug does not accept, or a slug outside the

        catalogue is a 400 with the resolver''s own message.'
      operationId: put_llm_config_v1_admin_llm_config__stage__put
      parameters:
      - description: An LLM stage, as `GET` lists them.
        in: path
        name: stage
        required: true
        schema:
          description: An LLM stage, as `GET` lists them.
          title: Stage
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmStageConfigUpdate'
        required: true
      responses:
