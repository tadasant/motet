  /v1/admin/overview:
    get:
      description: "The whole deployment at a glance, across every user. Admins only.\n\nDeployment state\
        \ rather than user state, like ``/v1/processing``: the caller's own\naccount plays no part in\
        \ the answer. ``user_id``, ``before`` and ``limit`` shape the\njob list only; the per-user and\
        \ per-queue aggregates are always for everyone.\n\n**The job list is a page, newest first, keyed\
        \ on the job id.** A keyset cursor rather\nthan an offset because the list is polled while workers\
        \ insert at its head: an offset\nwould shift under a reader every poll, and ``id < before`` does\
        \ not. Rather than a time\nwindow because a window does not bound the response \u2014 one Gmail\
        \ backfill puts a\nthousand rows into the last hour."
      operationId: admin_overview_v1_admin_overview_get
      parameters:
      - description: Only list jobs whose subject resolves to this user.
        in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only list jobs whose subject resolves to this user.
          title: User Id
      - description: "Only list jobs with an id below this one \u2014 the previous page's `jobs_next_before`.\
          \ Omit for the newest page."
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: "Only list jobs with an id below this one \u2014 the previous page's `jobs_next_before`.\
            \ Omit for the newest page."
          title: Before
      - description: How many jobs to list.
        in: query
        name: limit
        required: false
        schema:
          default: 200
          description: How many jobs to list.
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Admin Overview
      tags:
      - admin
  /v1/admin/waitlist:
    get:
      description: Everyone who asked to join from the landing page, newest first. Admins only.
      operationId: admin_waitlist_v1_admin_waitlist_get
      parameters:
      - description: "Only list signups with an id below this one \u2014 the previous page's `next_before`.\
          \ Omit for the newest page."
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: "Only list signups with an id below this one \u2014 the previous page's `next_before`.\
            \ Omit for the newest page."
          title: Before
      - description: How many signups to list.
        in: query
        name: limit
        required: false
        schema:
          default: 200
          description: How many signups to list.
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
