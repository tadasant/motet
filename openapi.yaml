          type: string
        position:
          description: This source item's position among them; 0 created it.
          title: Position
          type: integer
        read:
          title: Read
          type: boolean
        source_count:
          description: How many source items back this story.
          title: Source Count
          type: integer
        summary:
          title: Summary
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - summary
      - read
      - source_count
      - position
      title: SourceItemNewsItemResponse
      type: object
    SourceItemPulledStage:
      description: "Stage 1 of a source item's life: what the deterministic scrape pulled in.\n\nEverything\
        \ here was produced without a model \u2014 a poll, a fetch, and\n``motet_sources.extract``. ``text``\
        \ is the extracted text, not the raw message: the\nRFC 822 bytes are never stored, which ``raw_stored``\
        \ says out loud so that the UI does\nnot call the extracted text \"the email\"."
      properties:
        chars:
          description: Length of the extracted text.
          title: Chars
          type: integer
        external_id:
          anyOf:
          - type: string
          - type: 'null'
          description: The provider's own id for the message; null for a paste.
          title: External Id
        raw_stored:
          description: Whether the raw bytes the text was extracted from are kept. Always false.
          title: Raw Stored
          type: boolean
        received_at:
          description: When the message says it was sent; see HeldSourceItemResponse.
          format: date-time
          title: Received At
          type: string
        source_id:
          title: Source Id
          type: string
        source_kind:
          description: '''gmail'' or ''paste''.'
          title: Source Kind
          type: string
        source_name:
          title: Source Name
          type: string
        stored_at:
          description: When the source item row was written.
          format: date-time
          title: Stored At
          type: string
        text:
          description: The extracted text, in full.
          title: Text
          type: string
      required:
      - source_id
      - source_kind
      - source_name
      - external_id
      - received_at
      - stored_at
      - chars
      - text
      - raw_stored
      title: SourceItemPulledStage
      type: object
    SourceItemResponse:
      properties:
        id:
          title: Id
          type: string
        state:
          description: '''pending'' until a worker integrates it, then ''integrated'' or ''failed''.'
          title: State
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - state
      title: SourceItemResponse
      type: object
    SourceResponse:
      description: "A place source items come from \u2014 pasted text, or a connected mailbox.\n\n**Two\
        \ rows with no credential mean different things, and ``disconnected_at`` is what\ntells them apart.**\
        \ ``POST /v1/sources/connect`` creates a row before the user leaves\nfor the provider, so a consent\
        \ that was cancelled leaves one behind that never held a\ncredential. A mailbox that was disconnected\
        \ held one and gave it back. Both are\n``connected: false, active: false``. A row disconnected\
        \ before ``disconnected_at``\nexisted has it null, and its ``last_polled_at`` is the only tell."
      properties:
        active:
          description: 'False means connected but paused: it is not polled, and nothing is lost.'
          title: Active
          type: boolean
        connected:
          description: "Whether a credential is stored for this source. Answered without decrypting anything\
            \ \u2014 only workers can do that (invariant 8)."
          title: Connected
          type: boolean
        created_at:
          format: date-time
          title: Created At
          type: string
        disconnected_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the credential was forgotten through the disconnect route. Null for a source
            that is connected, was never connected, or was disconnected before this was recorded.
          title: Disconnected At
        first_sync_days:
          anyOf:
          - type: integer
          - type: 'null'
          description: How many days back this source's most recent first sync reached. A first sync reads
            only that window, so older matching mail is not ingested. Null until a first sync has run.
          title: First Sync Days
        id:
          title: Id
          type: string
        items_integrated:
          description: Of those, how many have been integrated into a news item, all time.
          title: Items Integrated
          type: integer
        items_pulled_in:
          description: Source items this source has produced, all time, in any state.
          title: Items Pulled In
          type: integer
        kind:
          description: '''paste'' or ''gmail''.'
          title: Kind
          type: string
        label_sync:
          anyOf:
          - $ref: '#/components/schemas/LabelSyncResponse'
          - type: 'null'
          description: Moving a message between Gmail labels when its owner ingests it (motet#96). null
            for any source that is not a mailbox.
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Error
        last_polled_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          title: Last Polled At
        last_sync:
          anyOf:
          - $ref: '#/components/schemas/SourceSyncResult'
          - type: 'null'
          description: The most recent poll's result. Null until one has run.
        name:
          title: Name
          type: string
        query:
          anyOf:
          - type: string
          - type: 'null'
          description: "The search this source is polled with \u2014 its own, or the default when it has\
            \ none \u2014 applied on every poll, not only the first. Null for a source that is not polled."
          title: Query
        scopes:
          description: OAuth scopes actually granted, which may be more than were asked for.
          items:
            type: string
          title: Scopes
          type: array
      required:
      - id
      - kind
      - name
      - active
      - connected
      - scopes
      - last_polled_at
      - last_error
      - created_at
      - query
      - first_sync_days
      - last_sync
      - disconnected_at
      - items_pulled_in
      - items_integrated
      title: SourceResponse
      type: object
    SourceSpanModel:
      description: "A half-open character range in a source item \u2014 what makes a claim checkable."
      properties:
        end:
          title: End
          type: integer
        source_item_id:
          title: Source Item Id
          type: string
        start:
          title: Start
          type: integer
      required:
      - source_item_id
      - start
      - end
      title: SourceSpanModel
      type: object
    SourceSyncResult:
      description: "What the most recent poll of a connected source found \u2014 or why it gave up."
      properties:
        at:
          description: When that poll finished, or gave up.
          format: date-time
          title: At
          type: string
        caught_up:
          description: "False while the search has matching messages left to list \u2014 a first sync\
            \ of a large backlog takes several polls, and each one queues the next. True once the search\
            \ is exhausted and only new mail is left to find."
          title: Caught Up
          type: boolean
        error:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the poll gave up after its retries, or null. A poll still being retried is
            not reported here.
          title: Error
        queued:
          description: Messages new to Motet that it queued for extraction.
          title: Queued
          type: integer
        seen:
          description: Messages it listed that match the source's filter, including ones already ingested.
            Zero for a poll that gave up.
          title: Seen
          type: integer
      required:
      - at
      - seen
      - queued
      - caught_up
      - error
      title: SourceSyncResult
      type: object
    StartLoginRequest:
      description: Begin a Google sign-in. Answered with a URL for the browser to visit.
      properties:
        redirect_uri:
          description: "Where Google sends the browser back to \u2014 this deployment's SPA origin plus\
            \ /oauth/callback. Supplied by the client for the same reason connecting a mailbox supplies\
            \ it: one bundle serves three environments, each with its own origin. It must be registered\
            \ on the OAuth client, and when MOTET_APP_BASE_URL is set the API additionally requires it\
            \ to match."
          minLength: 1
          title: Redirect Uri
          type: string
      required:
      - redirect_uri
      title: StartLoginRequest
      type: object
    StartLoginResponse:
      description: Where to send the browser, and the state that identifies this sign-in.
      properties:
        authorization_url:
          title: Authorization Url
          type: string
        state:
          description: The CSRF token for this sign-in. Returned so a client can verify the callback it
            receives is the one it started, and prefixed 'login.' so the single /oauth/callback path can
            tell a sign-in from a mailbox connection.
          title: State
          type: string
      required:
      - authorization_url
      - state
      title: StartLoginResponse
      type: object
    StartVoiceSessionRequest:
      properties:
        spoken_through_ms:
          anyOf:
          - minimum: 0.0
            type: integer
          - type: 'null'
          description: 'Where the listener''s player is. The session''s clock starts here (invariant 4:
            the position is ours, reported by the client''s player). Omitted means the episode''s own
            listened_through_ms.'
          title: Spoken Through Ms
      title: StartVoiceSessionRequest
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VoiceSessionResponse:
      description: What a client needs to open the voice socket, and nothing about the vendor behind it.
      properties:
        arm:
          description: Which arm answers. Informational; never branched on.
          title: Arm
          type: string
        authenticate_frame:
          additionalProperties: true
          description: Send this, verbatim and as the first frame, once the socket opens. It carries the
            session config the token was signed over; the voice service checks the two match, so it must
            not be altered.
          title: Authenticate Frame
          type: object
        conversational:
          title: Conversational
          type: boolean
        expires_at:
          title: Expires At
          type: string
        session_id:
          title: Session Id
          type: string
        session_token:
          title: Session Token
          type: string
        websocket_url:
          description: The socket to open, ws:// or wss://.
          title: Websocket Url
          type: string
      required:
      - session_id
      - session_token
      - expires_at
      - websocket_url
      - arm
      - conversational
      - authenticate_frame
      title: VoiceSessionResponse
      type: object
    VoiceStatusResponse:
      description: "Whether Play Live can run here \u2014 asked before a button is offered."
      properties:
        configured:
          description: Whether this deployment can mint a voice session. False means no voice service
            is configured, and the client should not offer Play Live.
          title: Configured
          type: boolean
        reason:
          anyOf:
          - type: string
          - type: 'null'
          description: Why not, as a sentence to show. Null when configured.
          title: Reason
      required:
      - configured
      title: VoiceStatusResponse
      type: object
    WaitlistJoinResponse:
      description: 'The landing page''s waitlist form was accepted.


        The same answer whether the address is new or already listed, so the route cannot be

        used to learn who is on the list.'
      properties:
        status:
          const: joined
          title: Status
          type: string
      required:
      - status
      title: WaitlistJoinResponse
      type: object
info:
  description: 'Motet turns a reading backlog into an interactive podcast.


    This document is generated from the FastAPI app and committed as `openapi.yaml`; the TypeScript client
    is generated from it in turn. Do not hand-edit either.'
  title: Motet API
  version: 0.1.0
openapi: 3.1.0
paths:
  /feed.xml:
    get:
      description: 'The private, authenticated RSS feed Phase 1 ships instead of a player.


        RSS buys background audio, offline, lockscreen, CarPlay, and speed control with zero

        iOS code. Audio is served from object storage behind signed URLs, so this document

        carries links, never bytes.'
      operationId: rss_feed_feed_xml_get
      parameters:
      - description: The feed's secret, from GET /v1/feed.
        in: query
        name: token
        required: false
        schema:
          default: ''
          description: The feed's secret, from GET /v1/feed.
          title: Token
          type: string
      responses:
        '200':
          content:
            application/rss+xml: {}
          description: The RSS feed
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Rss Feed
      tags:
      - feed
  /internal/health:
    get:
      description: "Liveness, plus whether telemetry and authentication are actually wired.\n\nThe flags\
        \ are not decoration. Exporters no-op silently when unconfigured, so without\nthis an unmonitored\
        \ process is indistinguishable from a quiet one \u2014 and an\nunauthenticated deployment is indistinguishable\
        \ from a working one until the bill\narrives.\n\n**\"internal\" in the path names an owned namespace,\
        \ not a network boundary.** This\nroute is unauthenticated and reachable by anyone who can reach\
        \ the service \u2014 which is\nthe point, since the whole reason motet#16 mattered is that health\
        \ has to be askable\nfrom outside. Nothing secret goes in the response; a new field here is public."
      operationId: health_internal_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Health
      tags:
      - ops
  /v1/admin/overview:
    get:
      description: "The whole deployment at a glance, across every user. Admins only.\n\nDeployment state\
        \ rather than user state, like ``/v1/processing``: the caller's own\naccount plays no part in\
        \ the answer. ``user_id``, ``before`` and ``limit`` shape the\njob list only; the per-user and\
        \ per-queue aggregates are always for everyone.\n\n**The job list is a page, newest first, keyed\
        \ on the job id.** A keyset cursor rather\nthan an offset because the list is polled while workers\
        \ insert at its head: an offset\nwould shift under a reader every poll, and ``id < before`` does\
        \ not. Rather than a time\nwindow because a window does not bound the response \u2014 one Gmail\
        \ backfill puts a\nthousand rows into the last hour."
      operationId: admin_overview_v1_admin_overview_get
      parameters:
      - description: Only list jobs whose subject resolves to this user.
        in: query
        name: user_id
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Only list jobs whose subject resolves to this user.
          title: User Id
      - description: "Only list jobs with an id below this one \u2014 the previous page's `jobs_next_before`.\
          \ Omit for the newest page."
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: "Only list jobs with an id below this one \u2014 the previous page's `jobs_next_before`.\
            \ Omit for the newest page."
          title: Before
      - description: How many jobs to list.
        in: query
        name: limit
        required: false
        schema:
          default: 200
          description: How many jobs to list.
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOverviewResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Admin Overview
      tags:
      - admin
  /v1/admin/waitlist:
    get:
      description: Everyone who asked to join from the landing page, newest first. Admins only.
      operationId: admin_waitlist_v1_admin_waitlist_get
      parameters:
      - description: "Only list signups with an id below this one \u2014 the previous page's `next_before`.\
          \ Omit for the newest page."
        in: query
        name: before
        required: false
        schema:
          anyOf:
          - minimum: 1
            type: integer
          - type: 'null'
          description: "Only list signups with an id below this one \u2014 the previous page's `next_before`.\
            \ Omit for the newest page."
          title: Before
      - description: How many signups to list.
        in: query
        name: limit
        required: false
        schema:
          default: 200
          description: How many signups to list.
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminWaitlistResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Admin Waitlist
      tags:
      - admin
  /v1/auth/google/callback:
    post:
      description: "Finish a sign-in: verify the ID token, check the allowlist, mint a session.\n\nThe\
        \ order is the point. The identity is established first and completely \u2014 signature\nagainst\
        \ Google's JWKS, audience, issuer, expiry, nonce, and ``email_verified`` \u2014 and\nonly then\
        \ is the address compared against ``MOTET_ALLOWED_EMAILS``. An email claim out\nof an unverified\
        \ token is a string somebody typed, and authorizing on one would be the\nwhole vulnerability this\
        \ route exists to avoid.\n\nThe state is consumed exactly once by a ``DELETE ... RETURNING``,\
        \ so a replayed\ncallback finds nothing rather than racing a concurrent one into two sessions."
      operationId: complete_login_v1_auth_google_callback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Complete Login
      tags:
      - auth
  /v1/auth/google/start:
    post:
      description: "Begin a sign-in: record the pending authorization and return a consent URL.\n\nThe\
        \ state and the PKCE verifier are stored rather than derived, for the same reason\nconnecting\
        \ a mailbox stores them \u2014 a callback that validated a state it recomputed\nfrom its own parameters\
        \ would defend against nothing. The OIDC ``nonce`` goes in the\nsame row: it travels out in the\
        \ request and comes back inside the signed ID token, so\nchecking it means remembering what was\
        \ sent.\n\nRefused before anything is written when no allowlist is configured. Sending someone\n\
        through Google's consent screen only to deny them afterwards is a worse answer than\nsaying the\
        \ deployment cannot do this yet."
      operationId: start_login_v1_auth_google_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Login
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: "Revoke this browser's session.\n\nA no-op for the shared API token, which is not a\
        \ session and cannot be revoked by a\nrequest \u2014 rotating it is a deploy. Answering 204 either\
        \ way is what lets a client sign\nout without first working out which kind of token it holds."
      operationId: logout_v1_auth_logout_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Logout
      tags:
      - auth
  /v1/auth/logout-all:
    post:
      description: "Revoke every session, including this one. The answer to a lost phone.\n\nIt exists\
        \ because the alternative is not an operation. `/v1/auth/logout` needs the\nvery token you are\
        \ trying to revoke, and invariant 10 says nobody has a shell to run\na `DELETE` from \u2014 so\
        \ without this, \"I left my laptop on a train\" would mean waiting\nout a thirty-day expiry, or\
        \ taking your own address off `MOTET_ALLOWED_EMAILS` and\nredeploying twice.\n\nReachable with\
        \ the shared API token as well as with a session, which is what makes it\nusable from a *different*\
        \ device than the compromised one."
      operationId: logout_everywhere_v1_auth_logout_all_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Logout Everywhere
      tags:
      - auth
  /v1/auth/session:
    get:
      description: "Who this request is, and how it proved it.\n\nAnswers for the shared API token too,\
        \ so the SPA can say \"signed in as \u2026\" or \"using an\nAPI token\" from what the *server*\
        \ believes rather than by inferring it from what it\nhappens to have in storage."
      operationId: current_session_v1_auth_session_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Current Session
      tags:
      - auth
  /v1/episodes:
    get:
      description: Every episode, newest first, whatever state it is in.
      operationId: list_episodes_v1_episodes_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EpisodeResponse'
                title: Response List Episodes V1 Episodes Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Episodes
      tags:
      - episodes
    post:
      description: "Assemble a manual episode from unread news items, capped by duration.\n\nReturns immediately,\
        \ in ``pending``. Assembly, scripting and TTS happen on the queue\nafterwards \u2014 so the episode\
        \ a client polls for moves through states rather than\nappearing finished."
      operationId: create_episode_v1_episodes_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEpisodeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Episode
      tags:
      - episodes
  /v1/episodes/smart:
    post:
      description: 'Assemble an episode by rule rather than by "everything unread".


        The rule is validated **here**, at creation, and stored as a snapshot on the episode.

        Validating at assembly time instead would surface a typo as a failed episode minutes

        later on a queue, with the mistake and the error in different places.'
      operationId: create_smart_episode_v1_episodes_smart_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSmartEpisodeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
          description: Successful Response
        '422':
          content:
