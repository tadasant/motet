      tags:
      - backlog
  /v1/news-items/{news_item_id}/read:
    post:
      description: 'Mark a news item read or unread.


        The same write that "I listened to this episode" performs, which is what invariant 5

        means in practice: one fact, one column, two ways of reaching it.'
      operationId: set_news_item_read_v1_news_items__news_item_id__read_post
      parameters:
      - in: path
        name: news_item_id
        required: true
        schema:
          title: News Item Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadStateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItemResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set News Item Read
      tags:
      - backlog
  /v1/processing:
    get:
      description: "Whether anything is draining the queues \u2014 the other half of \"where did my paste\
        \ go\".\n\n``/v1/ingestion`` says what is waiting. It cannot say whether anything is coming for\n\
        it, and a client that assumes one is is how the SPA came to promise \"a few seconds\"\nagainst\
        \ a queue nothing had touched in hours (motet#38).\n\nDeployment state rather than user state,\
        \ so it takes ``user_id`` only to sit behind\nthe same lock as everything else under ``/v1``.\
        \ There is one account in Phase 1 and one\nset of workers behind it; when there are many, the\
        \ queues are still shared and this\nanswer is still the same one.\n\n``readiness`` is the other\
        \ half of that same deployment question, for an operator or a\nscaler rather than for the SPA\
        \ (motet#78): how much is due per queue, and how many\nworkers that work could keep busy. It is\
        \ here because this is where the heartbeat\nalready is \u2014 \"is anything draining\" and \"\
        how much is there to drain\" are one glance \u2014\nand because it is the only surface that can\
        \ answer for a queue *no worker is running*,\nwhich is exactly the queue a scaler has to hear\
        \ about. The gauges the worker emits\ncarry the same numbers and go quiet in that case."
      operationId: processing_status_v1_processing_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessingStatusResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Processing Status
      tags:
      - ingestion
  /v1/source-items/dismiss:
    post:
      description: 'Discard held source items without spending inference on them.


        The other way out of the held list, so that a newsletter nobody wants briefed does not

        sit there forever. Only a held item can be dismissed; the rest are skipped, exactly as

        ``/integrate`` skips them. The row stays, as ``dismissed``, because it is what stops a

        re-poll from fetching the message and holding it again.'
      operationId: dismiss_source_items_v1_source_items_dismiss_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceItemIdsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DismissResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Dismiss Source Items
      tags:
      - ingestion
  /v1/source-items/held:
    get:
      description: "Source items extracted from a connected source and waiting to be ingested.\n\nConnecting\
        \ a source does the deterministic, free work on its own \u2014 poll, fetch,\nextract \u2014 and\
        \ stops before ``integrate``, the first stage that spends inference. What\nit leaves is a ``pending``\
        \ source item with no integrate job, and that combination is\nthe held state: no column records\
        \ it. Oldest message first, so the list reads as a\nqueue, and bounded at the most one request\
        \ may act on. A paste is never here for\nlonger than its own transaction, because pasting is asking."
      operationId: list_held_source_items_v1_source_items_held_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/HeldSourceItemResponse'
                title: Response List Held Source Items V1 Source Items Held Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Held Source Items
      tags:
      - ingestion
  /v1/source-items/integrate:
    post:
      description: "Queue held source items for integration \u2014 the owner saying \"ingest now\".\n\n\
        Each id that is the caller's, ``pending`` and without an integrate job gets one,\nwritten exactly\
        \ as a paste's is: same queue, same payload, same per-user serialization\nkey (invariant 6). Every\
        \ other id is skipped rather than refused \u2014 an item that was\nqueued a moment ago by a second\
        \ tab is not an error, and a response that 4xx'd on it\nwould make the first tab's success look\
        \ like a failure."
      operationId: integrate_source_items_v1_source_items_integrate_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceItemIdsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrateResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Integrate Source Items
      tags:
      - ingestion
  /v1/source-items/{source_item_id}:
    get:
      description: "One source item across its three stages.\n\nPulled in (the deterministic scrape),\
        \ processed (the steps that spend inference \u2014\ndedup today \u2014 with the decision dedup\
        \ recorded), and the news item it feeds. The\nanswer carries the item's full text, so another\
        \ user's item is a 404, the same as one\nthat does not exist."
      operationId: get_source_item_detail_v1_source_items__source_item_id__get
      parameters:
      - in: path
        name: source_item_id
        required: true
        schema:
          title: Source Item Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceItemDetailResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Source Item Detail
      tags:
      - ingestion
  /v1/source-items/{source_item_id}/enrich-transcript:
    get:
      description: "The newest agent run's redacted transcript for one item.\n\nIts own route rather than\
        \ a field on the detail: a transcript is the largest thing on an\nitem and nothing that *lists*\
        \ items needs it, so putting it on the detail would make the\nlifecycle drawer pay for it on every\
        \ open.\n\n**Already redacted when it was stored** \u2014 on the enrichment service, before it\
        \ crossed\nthe network (``motet_enrich.redact``). Nothing here redacts anything, and nothing here\n\
        should start to: a second redaction pass at read time would be a second definition of\nwhat is\
        \ safe, and the one that matters is the one that decided what got written down."
      operationId: get_enrich_transcript_v1_source_items__source_item_id__enrich_transcript_get
      parameters:
      - in: path
        name: source_item_id
        required: true
        schema:
          title: Source Item Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichTranscriptResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Enrich Transcript
      tags:
      - ingestion
  /v1/sources:
    get:
      description: 'Every source, connected or paused, with whether a credential exists.


        "Connected" is answered *without* decrypting anything: the credential row''s existence

        is the answer, and reading it needs no key. Invariant 8 means only workers can open

        one, so a screen that had to decrypt to render would have to break the invariant.'
      operationId: list_sources_v1_sources_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SourceResponse'
                title: Response List Sources V1 Sources Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Sources
      tags:
      - sources
  /v1/sources/callback:
    post:
      description: "Complete consent: exchange the code, seal the tokens, and start polling.\n\n**This\
        \ is the one place in the API that touches a third-party credential**, and it can\nonly seal \u2014\
        \ `wrapper` is the encrypt-only half of the vault, and the deployed service\naccount has no KMS\
        \ decrypt permission (invariant 8). The plaintext token exists only\nas a local variable inside\
        \ this function; it is never logged and never returned.\n\nThe state is consumed exactly once\
        \ by a `DELETE ... RETURNING`, so a replayed callback\nfinds nothing rather than racing a concurrent\
        \ one into two token exchanges."
      operationId: oauth_callback_v1_sources_callback_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Oauth Callback
      tags:
      - sources
  /v1/sources/connect:
    post:
      description: "Start connecting a mailbox: create the source and return a consent URL.\n\n**The source\
        \ row is created before consent completes**, and stays inactive until a\ncredential lands. That\
        \ ordering is what lets the callback identify what it is\nconnecting *to* without trusting anything\
        \ in the redirect: the source id is bound to\nthe stored `oauth_states` row, not carried in a\
        \ parameter an attacker could change.\n\nPKCE and a stored `state` are both required. `state`\
        \ alone is a CSRF token; the PKCE\nverifier is what makes an intercepted authorization code unusable.\n\
        \n**`redirect_uri` comes from the client, and that is safe rather than an oversight.**\nThe provider\
        \ validates it against the URIs registered on the OAuth client and rejects\nanything else, so\
        \ this route cannot be used to redirect a grant somewhere the owner of\nthat client did not allow\
        \ \u2014 and reaching this route at all requires the API bearer\ntoken. It is a parameter because\
        \ the SPA, a local dev server, and a future iOS app each\nhave a different one, and hardcoding\
        \ one would mean a code change per client."
      operationId: connect_source_v1_sources_connect_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectSourceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectSourceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Connect Source
      tags:
      - sources
  /v1/sources/paste:
    post:
      description: "Ingest pasted text as a source item.\n\nEnqueues rather than processes: ingestion\
        \ is serialized per user (invariant 6), so the\nwork belongs to a worker draining the queue, never\
        \ to the request thread. The row and\nthe job are written in the same transaction \u2014 with\
        \ two systems there would always be a\nwindow where the source item exists and nothing will ever\
        \ pick it up."
      operationId: paste_source_v1_sources_paste_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasteRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceItemResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Paste Source
      tags:
      - ingestion
  /v1/sources/{source_id}:
    delete:
      description: "Dismiss a consent attempt that never finished.\n\n`POST /v1/sources/connect` creates\
        \ the source row before the user leaves for the\nprovider, so every cancelled consent leaves one\
        \ behind, forever. This removes such a\nrow and **refuses everything else with a 409**: the built-in\
        \ paste source, any source\nthat holds or ever held a credential, and any source that has pulled\
        \ an item in. Those\nguards are the route, not a detail of it \u2014 deleting a source cascades\
        \ to its source\nitems and to the claims and highlights that cite them, which is why disconnecting\
        \ keeps\nthe row. `motet_db.phase2.remove_unused_source` holds the checks, under a row lock.\n\
        \nAnother user's source is a 404, exactly like one that does not exist."
      operationId: remove_source_v1_sources__source_id__delete
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Remove Source
      tags:
      - sources
  /v1/sources/{source_id}/credentials:
    delete:
      description: 'Forget a mailbox''s credentials and stop polling it.


        The source row and everything it ingested survive: deleting the source would cascade

        to its source items and take the claims that cite them with it, which would silently

        break the transcript of an episode the user has already heard.'
      operationId: disconnect_source_v1_sources__source_id__credentials_delete
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Disconnect Source
      tags:
      - sources
  /v1/sources/{source_id}/label-sync:
    put:
      description: "Choose the label a message leaves and the label it joins when its owner ingests it.\n\
        \nmotet#96. Stored on the source's ``config`` \u2014 the owner's intent \u2014 and read by the\n\
        worker after each *deliberate* ingest; nothing on the poll path reads it. Both empty\nturns label\
        \ sync off, and off means no mailbox write of any kind.\n\n**Setting labels widens nothing.**\
        \ A mailbox connected read-only stays read-only and\nreports ``needs_reauthorization``; the wider\
        \ grant is a separate, explicit step \u2014\n``POST /v1/sources/{id}/reauthorize`` \u2014 which\
        \ only a source with labels set may take.\nA system label that could hide mail (TRASH, SPAM, and\
        \ the rest outside INBOX, UNREAD,\nSTARRED and IMPORTANT) is refused here, and refused again by\
        \ the worker."
      operationId: set_label_sync_v1_sources__source_id__label_sync_put
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LabelSyncRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Label Sync
      tags:
      - sources
  /v1/sources/{source_id}/poll:
    post:
      description: "Queue a poll now, rather than waiting for the scheduler.\n\nEnqueues; it does not\
        \ fetch. Polling is serialized per source, so asking twice in a row\nproduces one run and one\
        \ deferral rather than two overlapping fetches.\n\nAnswers with ``sync_progress`` already saying\
        \ ``queued``: the job row is written in\nthis transaction, so ``_source_response``'s own read\
        \ sees it. That is what lets a client\nwhich *keeps* this answer \u2014 the iOS app puts the row\
        \ straight into its list and watches\nit \u2014 start watching immediately rather than waiting\
        \ for its next list fetch. It arrives\nthrough a default argument rather than from anything this\
        \ route says, so nothing here\nwould notice it stop; ``api/tests/test_sync_progress.py`` is what\
        \ pins it."
      operationId: poll_source_v1_sources__source_id__poll_post
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Poll Source
      tags:
      - sources
  /v1/sources/{source_id}/reauthorize:
    post:
      description: "Ask the owner to let this mailbox's labels be changed \u2014 the label-sync re-consent.\n\
        \n**The only route that ever asks Google for ``gmail.modify``, and only for a source that\nhas\
        \ label sync set.** Connecting asks for ``gmail.readonly`` alone, so a mailbox whose\nowner never\
        \ turns label sync on is never shown a consent screen that mentions changing\nmail, and never\
        \ holds a grant that could. Refused with 409 until labels are set, so the\nwider scope is always\
        \ asked for *because of* a setting the owner chose.\n\nThe consent itself is the owner's click\
        \ (invariant 9) and finishes on the same\n``/v1/sources/callback`` a first connect does, against\
        \ the same source: the new grant\nreplaces the stored one, and the worker refreshes any access\
        \ token minted under the old\none before it writes. The URL carries a ``login_hint`` for the address\
        \ the source was\nfirst seen to reach, and the worker refuses \u2014 and disconnects \u2014 a\
        \ grant that reaches a\ndifferent one, because Google's account chooser does not stop the owner\
        \ picking another."
      operationId: reauthorize_source_v1_sources__source_id__reauthorize_post
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthorizeSourceRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectSourceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Reauthorize Source
      tags:
      - sources
  /v1/sources/{source_id}/resync:
    post:
      description: "Search this mailbox again from a chosen number of days ago, and keep that window.\n\
        \n**The repair for a first sync that was too short** (motet#139). A mailbox's window is\nread\
        \ only by the page that *begins* a search, so widening it on a source already part\nway through\
        \ one changes nothing \u2014 the watermark has moved past the older mail and no\nlater poll ever\
        \ looks behind it. This writes the new window and asks the next poll to\nbegin a fresh search\
        \ over it.\n\n**Cheap, and safe to press twice.** The re-listed messages are mostly ones already\n\
        ingested, and the poll's pre-check drops a message that has a row or an extract job\nbefore it\
        \ is fetched \u2014 so what this costs is listing. Nothing is re-extracted, nothing\nis re-deduped,\
        \ and nothing already in the backlog is duplicated: ``source_items`` is\nunique on ``(source_id,\
        \ external_id)``.\n\nRequesting and honouring are deliberately separate: the request is parked\
        \ in the\nsource's ``config``, which no poll rewrites, so pressing this while a sync is in flight\n\
        is honoured by the next link of the chain rather than lost under the running poll's own\n``sync_state``\
        \ write."
      operationId: resync_source_v1_sources__source_id__resync_post
      parameters:
      - in: path
        name: source_id
        required: true
        schema:
          title: Source Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResyncRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Resync Source
      tags:
      - sources
  /v1/voice:
    get:
      description: "Whether Play Live can run in this deployment.\n\nAsked by the SPA before it offers\
        \ the button, so that an environment with no voice\nservice shows a disabled control with a reason\
        \ \u2014 never a request to a host that does\nnot exist, and never a failed call in the console."
      operationId: voice_status_v1_voice_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceStatusResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Voice Status
      tags:
      - voice
  /v1/waitlist:
    post:
      description: 'Put an address on the landing page''s waitlist. Public; no credential.


        Sent as a form, so that the landing page''s request is a CORS simple request and needs

        no preflight. Answers JSON when the caller''s ``Accept`` asks for it and a small HTML

        page otherwise, which is what a form posted without JavaScript lands on. A new

