info:
  description: 'Motet turns a reading backlog into an interactive podcast.


    This document is generated from the FastAPI app and committed as `openapi.yaml`; the TypeScript client
    is generated from it in turn. Do not hand-edit either.'
  title: Motet API
  version: 0.1.0
openapi: 3.1.0
paths:
  /feed.xml:
    get:
      description: 'The private, authenticated RSS feed Phase 1 ships instead of a player.


        RSS buys background audio, offline, lockscreen, CarPlay, and speed control with zero

        iOS code. Audio is served from object storage behind signed URLs, so this document

        carries links, never bytes.'
      operationId: rss_feed_feed_xml_get
      parameters:
      - description: The feed's secret, from GET /v1/feed.
        in: query
        name: token
        required: false
        schema:
          default: ''
          description: The feed's secret, from GET /v1/feed.
          title: Token
          type: string
      responses:
        '200':
          content:
            application/rss+xml: {}
          description: The RSS feed
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Rss Feed
      tags:
      - feed
  /healthz:
    get:
      description: "Liveness, plus whether telemetry and authentication are actually wired.\n\nThe flags\
        \ are not decoration. Exporters no-op silently when unconfigured, so without\nthis an unmonitored\
        \ process is indistinguishable from a quiet one \u2014 and an\nunauthenticated deployment is indistinguishable\
        \ from a working one until the bill\narrives."
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Healthz
      tags:
      - ops
  /v1/episodes:
    get:
      description: Every episode, newest first, whatever state it is in.
      operationId: list_episodes_v1_episodes_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/EpisodeResponse'
                title: Response List Episodes V1 Episodes Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Episodes
      tags:
      - episodes
    post:
      description: "Assemble a manual episode from unread news items, capped by duration.\n\nReturns immediately,\
        \ in ``pending``. Assembly, scripting, grounding validation, and TTS\nhappen on the queue afterwards,\
        \ and nothing is synthesized until grounding passes\n(invariant 3) \u2014 so the episode a client\
        \ polls for moves through states rather than\nappearing finished."
      operationId: create_episode_v1_episodes_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEpisodeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Episode
      tags:
      - episodes
  /v1/episodes/{episode_id}:
    get:
      description: "An episode with its transcript \u2014 each claim beside the span it came from."
      operationId: get_episode_v1_episodes__episode_id__get
      parameters:
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Episode
      tags:
      - episodes
  /v1/episodes/{episode_id}/audio:
    get:
      description: "Serve an episode's audio, or redirect to a signed URL for it.\n\nWhich of the two\
        \ depends on the storage backend, and the *store* decides rather than\nthis route: a backend that\
        \ can mint a signed URL returns one, and one that cannot\nreturns ``None``. A podcast client cannot\
        \ tell the difference \u2014 it follows the\nredirect \u2014 so the enclosure URL in the feed\
        \ is stable across both, and a signed URL's\nexpiry never ends up cached inside a feed document."
      operationId: episode_audio_v1_episodes__episode_id__audio_get
      parameters:
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - description: The feed's secret, from GET /v1/feed.
        in: query
        name: token
        required: false
        schema:
          default: ''
          description: The feed's secret, from GET /v1/feed.
          title: Token
          type: string
      responses:
        '200':
          content:
            audio/mpeg: {}
          description: The episode audio
        '307':
          description: Redirect to a time-limited signed URL
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Episode Audio
      tags:
      - feed
  /v1/episodes/{episode_id}/listened:
    post:
      description: "Mark every news item in this episode read.\n\nPhase 1's stand-in for playback tracking:\
        \ RSS gives background audio and CarPlay for\nfree, and takes away any way for a client to report\
        \ where the listener got to. Phase\n2's iOS app reports ``spoken_through_ms`` and this becomes\
        \ automatic \u2014 but the fact it\nwrites is the same one, on the same column, which is why swapping\
        \ the trigger later\nchanges nothing about read state."
      operationId: mark_episode_listened_v1_episodes__episode_id__listened_post
      parameters:
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkListenedResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Mark Episode Listened
      tags:
      - episodes
  /v1/feed:
    get:
      description: The private feed URL, minting a token on first ask.
      operationId: get_feed_info_v1_feed_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
