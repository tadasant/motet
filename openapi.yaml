    PasteRequest:
      description: "A blob of text pasted in by hand \u2014 Phase 1's only ingestion route."
      properties:
        text:
          minLength: 1
          title: Text
          type: string
        title:
          maxLength: 500
          minLength: 1
          title: Title
          type: string
      required:
