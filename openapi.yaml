            application/json:
              schema:
                $ref: '#/components/schemas/AdminWaitlistResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Admin Waitlist
      tags:
      - admin
  /v1/auth/google/callback:
    post:
      description: "Finish a sign-in: verify the ID token, check the allowlist, mint a session.\n\nThe\
        \ order is the point. The identity is established first and completely \u2014 signature\nagainst\
        \ Google's JWKS, audience, issuer, expiry, nonce, and ``email_verified`` \u2014 and\nonly then\
        \ is the address compared against ``MOTET_ALLOWED_EMAILS``. An email claim out\nof an unverified\
        \ token is a string somebody typed, and authorizing on one would be the\nwhole vulnerability this\
        \ route exists to avoid.\n\nThe state is consumed exactly once by a ``DELETE ... RETURNING``,\
        \ so a replayed\ncallback finds nothing rather than racing a concurrent one into two sessions."
      operationId: complete_login_v1_auth_google_callback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Complete Login
      tags:
      - auth
  /v1/auth/google/start:
    post:
      description: "Begin a sign-in: record the pending authorization and return a consent URL.\n\nThe\
        \ state and the PKCE verifier are stored rather than derived, for the same reason\nconnecting\
        \ a mailbox stores them \u2014 a callback that validated a state it recomputed\nfrom its own parameters\
        \ would defend against nothing. The OIDC ``nonce`` goes in the\nsame row: it travels out in the\
        \ request and comes back inside the signed ID token, so\nchecking it means remembering what was\
        \ sent.\n\nRefused before anything is written when no allowlist is configured. Sending someone\n\
        through Google's consent screen only to deny them afterwards is a worse answer than\nsaying the\
        \ deployment cannot do this yet."
      operationId: start_login_v1_auth_google_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartLoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Login
      tags:
      - auth
  /v1/auth/logout:
    post:
      description: "Revoke this browser's session.\n\nA no-op for the shared API token, which is not a\
        \ session and cannot be revoked by a\nrequest \u2014 rotating it is a deploy. Answering 204 either\
        \ way is what lets a client sign\nout without first working out which kind of token it holds."
      operationId: logout_v1_auth_logout_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Logout
      tags:
      - auth
  /v1/auth/logout-all:
    post:
      description: "Revoke every session, including this one. The answer to a lost phone.\n\nIt exists\
        \ because the alternative is not an operation. `/v1/auth/logout` needs the\nvery token you are\
        \ trying to revoke, and invariant 10 says nobody has a shell to run\na `DELETE` from \u2014 so\
        \ without this, \"I left my laptop on a train\" would mean waiting\nout a thirty-day expiry, or\
        \ taking your own address off `MOTET_ALLOWED_EMAILS` and\nredeploying twice.\n\nReachable with\
        \ the shared API token as well as with a session, which is what makes it\nusable from a *different*\
        \ device than the compromised one.\n\n**A personal access token may not call it**, and that is\
        \ a recovery property rather\nthan tidiness. A PAT is not revoked by this (see `revoke_api_token`),\
        \ so a leaked one\nleft able to call it could delete the owner's browser session on a loop \u2014\
        \ and the\nowner's session is the only credential that can reach the revoke route. That would\n\
        make the leaked credential able to out-race its own revocation, which is the exact\nthing \"rotating\
        \ the shared secret is a deploy\" was the weakness of."
      operationId: logout_everywhere_v1_auth_logout_all_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevokedResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Logout Everywhere
      tags:
      - auth
  /v1/auth/mcp/callback:
    post:
      description: 'Finish the Google half of an MCP client''s authorization (motet#111).


        Unauthenticated, like the sign-in callback, and for the same reason: the browser that

        arrives holds nothing yet. The identity is verified and the allowlist checked exactly as

        signing in does; what comes back is not a session for this browser but the client''s

        authorization code, wrapped in the URLs the SPA offers the person as Allow and Deny.'
      operationId: complete_mcp_authorization_v1_auth_mcp_callback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpAuthorizationResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Complete Mcp Authorization
      tags:
      - auth
  /v1/auth/native/redeem:
    post:
      description: 'Collect a sign-in the iOS app started: code plus verifier in, session out.


        The code alone is not enough, which is the point of the verifier. The handoff link

        travels through a custom URL scheme, and another app can register the same one; what

        it cannot have is the verifier, which never left the app that made the challenge.


        The allowlist is asked again here, because this is the moment a session is minted and

        ``create_session``''s contract is that every writer asks.


        **The code is consumed by the redeem that succeeds, not by the first one that arrives.**

        A refused redeem raises, the request''s transaction rolls back, and the ``DELETE`` in

        ``take_handoff`` goes with it. That is the right direction: a guess without the verifier

        cannot burn the real app''s sign-in, and a 256-bit verifier is not something to guess.'
      operationId: redeem_native_login_v1_auth_native_redeem_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemNativeLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Redeem Native Login
      tags:
      - auth
  /v1/auth/native/start:
    post:
      description: "Begin a sign-in for the iOS app: the web sign-in, returned to the app by a handoff.\n\
        \nDecided by Tadas, 2026-09-13 (AGENTS.md, \"The phone signs in through the web sign-in\").\n\
        The app opens the URL this returns in its system sign-in sheet. Google sends that\nsheet back\
        \ to this deployment's *web app*, whose callback is the one already\nregistered on the OAuth client\
        \ \u2014 so the phone needs no Google client of its own \u2014 and\nthe web app posts the code\
        \ to ``/v1/auth/google/callback`` exactly as a browser does.\nThe pending row carries the app's\
        \ PKCE challenge, which is what makes that callback\nanswer with a handoff link rather than a\
        \ session.\n\nThe redirect URI is built here from ``MOTET_APP_BASE_URL`` rather than taken from\
        \ the\ncaller: the app knows the API's address, not the web app's, and a caller-supplied\nredirect\
        \ on an unauthenticated route is the shape ``start_login`` already refuses."
      operationId: start_native_login_v1_auth_native_start_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartNativeLoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartNativeLoginResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Start Native Login
      tags:
      - auth
  /v1/auth/session:
    get:
      description: "Who this request is, and how it proved it.\n\nAnswers for the shared API token too,\
        \ so the SPA can say \"signed in as \u2026\" or \"using an\nAPI token\" from what the *server*\
        \ believes rather than by inferring it from what it\nhappens to have in storage."
      operationId: current_session_v1_auth_session_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Current Session
      tags:
      - auth
  /v1/auth/tokens:
    get:
      description: "Every personal access token this account holds: live ones first, then revoked.\n\n\
        Revoked ones are included and marked, because with no database shell (invariant 10)\nthis list\
        \ is the only place \"which tokens existed, and when did each stop\" can be\nasked \u2014 and\
        \ they sort last so that nothing which can still authenticate falls off the\nbound, since this\
        \ list is also the only way to revoke. No row carries a secret."
      operationId: list_api_tokens_v1_auth_tokens_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ApiTokenResponse'
                title: Response List Api Tokens V1 Auth Tokens Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Api Tokens
      tags:
      - auth
    post:
      description: "Mint a personal access token and return it **once**.\n\nThe plaintext is in this response\
        \ body and nowhere else: only its SHA-256 is stored,\nnothing logs it, and no other route can\
        \ return it. A lost token is revoked and\nre-minted rather than recovered \u2014 which is the\
        \ same trade `auth_sessions` already\nmakes, and the opposite of the feed token's, because that\
        \ one has to be readable back\nonto a new device and this one is pasted into an environment.\n\
        \nThe address recorded on the row is the signed-in caller's, and it is what the\nallowlist is\
        \ re-checked against on every subsequent request. It is never None here \u2014\n`require_session`\
        \ admits only a caller `deps.is_browser_session` accepts, and an\naddress is part of that question\
        \ rather than a second check on top of it, which is\nwhy this reads the value rather than asserting\
        \ about it (`python -O` drops asserts)."
      operationId: create_api_token_v1_auth_tokens_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiTokenRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedApiTokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Api Token
      tags:
      - auth
  /v1/auth/tokens/{token_id}:
    delete:
      description: 'Revoke one token, immediately. Answers with the row it stamped.


        Immediate because the lookup filters on `revoked_at` rather than waiting for a sweep,

        so the next request on that token is refused. Revoking an already-revoked token is not

        an error: a client that retries gets the same answer twice.


        This is also the "lost laptop" lever for tokens, and it is deliberately **not** part of

        `/v1/auth/logout-all`. That route revokes sessions, and folding tokens into it would

        mean a person signing out everywhere silently killed the credential an agent is running

        on. Reaching this route from another device needs only a sign-in, which is the property

        `logout-all` exists for.'
      operationId: revoke_api_token_v1_auth_tokens__token_id__delete
      parameters:
      - in: path
        name: token_id
        required: true
        schema:
          title: Token Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiTokenResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Revoke Api Token
      tags:
      - auth
  /v1/connectors:
    get:
      description: 'Every site and MCP server this user has added, with whether a secret is stored.


        Answered without decrypting anything, for ``/v1/sources``'' reason: the API cannot open

        a credential (invariant 8), so a screen that needed one opened would need the invariant

        broken.'
      operationId: list_connectors_v1_connectors_get
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ConnectorResponse'
                title: Response List Connectors V1 Connectors Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Connectors
      tags:
      - connectors
    post:
      description: "Add a site \u2014 the opt-in to fetching its articles \u2014 or an MCP server.\n\n\
        A site needs only its domain; its username and password are for a site that needs a\nlogin, and\
        \ the password is sealed here and never readable again from this process. An\nMCP server is refused\
        \ without ``acknowledge_risk``, and starts ``needs_auth``: nothing\nabout it works until ``/authorize``\
        \ and the callback have produced a token set."
      operationId: create_connector_v1_connectors_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConnectorRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Connector
      tags:
      - connectors
  /v1/connectors/oauth/callback:
    post:
      description: 'Exchange the code, seal the token set onto the connector, and mark it ready.


        The token set exists as a local variable and nowhere else: it is sealed under

        ``user_id:connector_id:mcp`` and this process cannot read it back. A state from either

        other flow is refused *before* the consume, as ``/v1/sources/callback`` refuses one, so

        a misrouted callback does not burn the authorization it belongs to.'
      operationId: connector_oauth_callback_v1_connectors_oauth_callback_post
      parameters:
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectorOAuthCallbackRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Connector Oauth Callback
      tags:
      - connectors
  /v1/connectors/{connector_id}:
    delete:
      description: Forget a connector and its sealed secret. Another user's is a 404, like a missing one.
      operationId: delete_connector_v1_connectors__connector_id__delete
      parameters:
      - in: path
        name: connector_id
        required: true
        schema:
          title: Connector Id
          type: string
      - in: header
        name: authorization
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Connector
      tags:
      - connectors
  /v1/connectors/{connector_id}/authorize:
    post:
      description: "Discover the server's authorization server, register a client, mint a consent URL.\n\
        \n**Nothing about the connector changes until consent completes.** What discovery and\nregistration\
        \ produced is bound to the state row and written onto the connector only by\nthe callback, beside\
        \ the token set it issued \u2014 so a re-authorize the owner abandons\nleaves a working server's\
        \ client, endpoint and grant exactly as they were.\n\nDiscovery runs on every authorize, because\
        \ a person re-authorizing is the moment to\nnotice a server that moved. The recorded client is\
        \ reused only while both the issuer\nand the redirect URI it was registered with are unchanged:\
        \ a dynamically registered\nclient is bound to its redirect URI, so a new app origin needs a new\
