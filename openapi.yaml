info:
  description: 'Motet turns a reading backlog into an interactive podcast.


    This document is generated from the FastAPI app and committed as `openapi.yaml`; the TypeScript client
    is generated from it in turn. Do not hand-edit either.'
  title: Motet API
  version: 0.1.0
openapi: 3.1.0
paths:
  /feed.xml:
    get:
      description: 'The private, authenticated RSS feed Phase 1 ships instead of a player.


        RSS buys background audio, offline, lockscreen, CarPlay, and speed control with zero

        iOS code. Audio is served from GCS behind signed URLs, so this document carries links,

        never bytes.'
      operationId: rss_feed_feed_xml_get
      responses:
        '200':
          content:
            application/rss+xml: {}
          description: The RSS feed
      summary: Rss Feed
      tags:
      - feed
  /healthz:
    get:
      description: 'Liveness, plus whether telemetry is actually wired.


        The telemetry flags are not decoration. Exporters no-op silently when unconfigured, so

        without this an unmonitored process is indistinguishable from a quiet one.'
      operationId: healthz_healthz_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: Successful Response
      summary: Healthz
      tags:
      - ops
  /v1/episodes:
    post:
      description: 'Assemble a manual episode from unread news items, capped by duration.


        Scripting, grounding validation, and TTS happen on the queue afterwards. Nothing is

        synthesized until grounding passes (invariant 3).'
      operationId: create_episode_v1_episodes_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEpisodeRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Episode
      tags:
      - episodes
  /v1/episodes/{episode_id}:
    get:
      description: "An episode with its transcript \u2014 each claim beside the span it came from."
      operationId: get_episode_v1_episodes__episode_id__get
      parameters:
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EpisodeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Episode
      tags:
      - episodes
  /v1/news-items:
    get:
      description: 'The backlog: deduped news items with their read state (invariant 5).'
      operationId: list_news_items_v1_news_items_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/NewsItemResponse'
                title: Response List News Items V1 News Items Get
                type: array
          description: Successful Response
      summary: List News Items
      tags:
      - backlog
  /v1/sources/paste:
    post:
      description: 'Ingest pasted text as a source item.


        Enqueues rather than processes: ingestion is serialized per user (invariant 6), so the

        work belongs to a worker draining the queue, never to the request thread.'
      operationId: paste_source_v1_sources_paste_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasteRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceItemResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Paste Source
      tags:
      - ingestion
