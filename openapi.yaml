    LoginResponse:
      description: "A session and the token that presents it \u2014 or, for a sign-in the iOS app started,\n\
        the link that hands it back to the app.\n\n``token`` is returned exactly once, here \u2014 the\
        \ API stores only its hash, so it cannot\nbe read back. A client that loses it signs in again.\n\
        \nExactly one of ``token`` and ``handoff_url`` is set. A browser sign-in gets a token.\nA sign-in\
        \ started by ``POST /v1/auth/native/start`` finishes in the app's in-app\nbrowser, which must\
        \ not keep the session: it gets ``handoff_url`` instead, navigates\nto it, and the app redeems\
        \ the code inside it at ``POST /v1/auth/native/redeem``."
      properties:
        email:
          description: The Google account that signed in.
          title: Email
          type: string
        expires_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the session expires. Absent when handoff_url is set.
          title: Expires At
        handoff_url:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Set only for a sign-in the iOS app started: a motet:// link carrying a one-time
            code, built by the API. Navigate to it; do not store anything.'
          title: Handoff Url
        token:
          anyOf:
          - type: string
          - type: 'null'
          description: 'Send as ''Authorization: Bearer <token>'', like the API token. Absent when handoff_url
            is set.'
          title: Token
      required:
      - email
      title: LoginResponse
      type: object
