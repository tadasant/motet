  /v1/episodes/{episode_id}/audio:
    get:
      description: "Serve an episode's audio, or redirect to a signed URL for it.\n\nWhich of the two\
        \ depends on the storage backend, and the *store* decides rather than\nthis route: a backend that\
        \ can mint a signed URL returns one, and one that cannot\nreturns ``None``. A podcast client cannot\
        \ tell the difference \u2014 it follows the\nredirect \u2014 so the enclosure URL in the feed\
        \ is stable across both, and a signed URL's\nexpiry never ends up cached inside a feed document.\n\
        \n**The object is asked for before a URL is signed for it.** A signed URL is minted\nwithout touching\
        \ the object, so a redirect used to be issued for audio a bucket's\nretention rule had already\
        \ deleted: the browser followed it into the store's 404,\nwhich an ``<audio>`` element reports\
        \ as nothing more specific than \"could not load\" \u2014\nand the episode screen then blamed\
        \ the browser. A 410 here, with a sentence, is what\nlets the player say the audio is gone rather\
        \ than broken. It costs one metadata read\nper request to this route: Chrome asks it once per\
        \ load and sends its range requests to\nthe signed URL, and WebKit may come back to it on a seek,\
        \ which then pays the read\nbeside the signing it already paid for."
      operationId: episode_audio_v1_episodes__episode_id__audio_get
      parameters:
      - in: path
        name: episode_id
        required: true
        schema:
          title: Episode Id
          type: string
      - description: The feed's secret, from GET /v1/feed.
        in: query
        name: token
        required: false
        schema:
          default: ''
          description: The feed's secret, from GET /v1/feed.
          title: Token
          type: string
      responses:
        '200':
          content:
            audio/mpeg: {}
          description: The episode audio
        '206':
          content:
            audio/mpeg: {}
          description: One byte range of the audio
        '307':
          description: Redirect to a time-limited signed URL
        '410':
          description: The audio was rendered once and is no longer in storage
        '416':
          description: The requested byte range is outside the audio
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Episode Audio
      tags:
      - feed
