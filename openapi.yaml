    IngestionItemResponse:
      description: "One ingested item that has not settled into the backlog yet \u2014 and why not.\n\n\
        This exists because \"pending\" used to be a thing the system knew and never said. A\npaste was\
        \ accepted, queued, retried, and eventually abandoned entirely inside the\nworker, and the only\
        \ surface that could have shown any of it \u2014 the backlog \u2014 lists\nnews items, which is\
        \ precisely what a failed item never becomes.\n\n``attempts`` and ``next_attempt_at`` are here\
        \ so that *retrying* and *stuck* are\ndistinguishable. They are not the same thing to a person\
        \ standing there waiting, and\na spinner that means both is a spinner that means neither.\n\n\
        **Not always a source item.** A mailbox message whose fetch failed has no\n``source_items`` row\
        \ \u2014 that is written when extraction succeeds \u2014 so it is reported\nfrom its extract job,\
        \ under a synthesized ``id`` and a ``title`` naming the provider's\nmessage id. Every other field\
        \ means the same thing either way. Ids are\nopaque to clients and nothing addresses this route's\
        \ rows, so the two shapes are one\nresponse model rather than two (motet#35).\n\n**``last_error``\
        \ is the exception the stage raised, unedited, and that is the decision\nrather than an oversight.**\
        \ It is a new egress: an httpx error names the base URL it\ndialled, a psycopg one names the database\
        \ host. The caller is the deployment's single\nowner behind ``require_caller`` \u2014 the same\
        \ person who reads the obs stack, where the\nidentical string already goes \u2014 so there is\
        \ no reader here who could not already see\nit. Mapping unknown exceptions to a generic string\
        \ would buy nothing from that reader\nand would hand them back the \"Failed\", with no reason,\
        \ that this whole surface exists\nto replace. Revisit it when there is more than one account (Phase\
        \ 3): at that point the\nreader and the operator stop being the same person, and this becomes\
        \ a real leak."
      properties:
        attempts:
          description: Processing attempts spent so far. 0 means it has not been picked up yet.
          title: Attempts
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          description: What the most recent attempt said, verbatim. Present while retrying as well as
            after failing, because the reason is the thing that says whether to wait, re-paste, or report
            it.
          title: Last Error
        max_attempts:
          description: Attempts before the pipeline gives up and the state becomes 'failed'.
          title: Max Attempts
          type: integer
        next_attempt_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: "When the next attempt is due. Null means there is nothing scheduled: it is either\
            \ being processed right now, or it is finished \u2014 see 'state'."
          title: Next Attempt At
        source_id:
          description: Which source it came from. With two mailboxes connected, 'source_kind' says only
            that it was a mailbox; this says which one.
          title: Source Id
          type: string
        source_kind:
          description: "How this arrived: 'paste' for text pasted in, 'gmail' for a polled mailbox message.\
            \ It decides what a person can do about a failure \u2014 a failed paste can be pasted again,\
            \ and a failed mailbox message cannot, because the poll cursor has already moved past it."
          title: Source Kind
          type: string
        state:
          description: '''pending'' while the queue still owns it, ''failed'' once the retries ran out,
            ''integrated'' for the few minutes after it succeeded.'
          title: State
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - state
      - attempts
      - max_attempts
      - next_attempt_at
      - last_error
      - created_at
      - source_kind
      - source_id
      title: IngestionItemResponse
      type: object
    IntegrateResponse:
      properties:
        queued:
          description: Ids that were held and now have an integrate job.
          title: Queued
          type: integer
        skipped:
          description: 'Ids that did not qualify: unknown, another user''s, already queued, already integrated,
            or dismissed. Never an error.'
          title: Skipped
          type: integer
      required:
      - queued
      - skipped
      title: IntegrateResponse
      type: object
    LabelSyncRequest:
      description: 'Set, change, or clear a mailbox''s label-sync settings.


        Both empty turns label sync off. Setting a label does **not** widen the grant: a mailbox

        connected read-only reports ``needs_reauthorization`` until its owner re-consents.'
      properties:
        add_label:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Add Label
        remove_label:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Remove Label
      title: LabelSyncRequest
      type: object
    LabelSyncResponse:
      description: "One mailbox's label-sync settings, whether they can act, and what they have done.\n\
        \n``status`` is the one field a screen branches on. ``off`` \u2014 no labels set, and nothing\
        \ is\never written. ``needs_reauthorization`` \u2014 labels are set, but the mailbox was connected\n\
        read-only, so nothing is written until its owner re-consents; the write-back records\nthat on\
        \ every deliberate ingest rather than calling Gmail. ``on`` \u2014 labels are set and\nthe grant\
        \ carries ``gmail.modify``."
      properties:
        add_label:
          anyOf:
          - type: string
          - type: 'null'
          description: Label put on a message when it is ingested.
          title: Add Label
        available_labels:
          description: 'Label names read from the mailbox by its last poll, for the pickers: the user''s
            own labels, then the system labels Motet will write (INBOX, UNREAD, STARRED, IMPORTANT). Empty
            until a poll has read them.'
          items:
            type: string
          title: Available Labels
          type: array
        failed_items:
          description: "Ingested items whose message could not be moved, and never was since \u2014 counted\
            \ from when this mailbox was last authorized, so a re-consent clears the failures it resolves."
          title: Failed Items
          type: integer
        labels_read_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the label list was last read from the mailbox.
          title: Labels Read At
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the newest of those could not be moved.
          title: Last Error
        last_synced_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: The newest time a message from this mailbox was moved.
          title: Last Synced At
        modify_granted:
          description: Whether this mailbox's grant can change labels at all. False for every mailbox
            that has not re-consented for label sync, which is the default.
          title: Modify Granted
          type: boolean
        remove_label:
          anyOf:
          - type: string
          - type: 'null'
          description: Label taken off a message when it is ingested.
          title: Remove Label
        status:
          enum:
          - 'off'
          - needs_reauthorization
          - 'on'
          title: Status
          type: string
      required:
      - status
      - remove_label
      - add_label
      - modify_granted
      - available_labels
      - labels_read_at
      - last_synced_at
      - failed_items
      - last_error
      title: LabelSyncResponse
      type: object
    ListenProgressRequest:
      description: 'How far into an episode the listener has got.


        Invariant 4: we own playback position, so this is a *report* from a client that we

        record, never a value read back out of a vendor SDK. Invariant 5 is what it does: a

        story whose segment has been passed is marked read, which is the same fact the backlog

        screen''s toggle writes.


        The body of both ``PUT /v1/episodes/{id}/position`` and

        ``POST /v1/episodes/{id}/progress``, because they are one write. The name is the

        server''s: ``spoken_through_ms`` is the voice session contract''s word for a position

        that moves backwards when a listener seeks back, and this value deliberately does not.'
      properties:
        listened_through_ms:
          description: "Monotonic on the server: seeking backwards is reviewing, not un-listening, so\
            \ a smaller value never lowers the recorded position or un-marks a story. Send the furthest\
            \ point reached rather than the playhead \u2014 the response carries the value that was actually\
            \ stored, which is what to resume from."
          minimum: 0.0
          title: Listened Through Ms
          type: integer
      required:
      - listened_through_ms
      title: ListenProgressRequest
      type: object
    ListenProgressResponse:
      properties:
        episode_id:
          title: Episode Id
          type: string
        listened_through_ms:
          description: The position after applying monotonicity.
          title: Listened Through Ms
          type: integer
        news_items_marked_read:
          title: News Items Marked Read
          type: integer
      required:
      - episode_id
      - listened_through_ms
      - news_items_marked_read
      title: ListenProgressResponse
      type: object
    LoginResponse:
      description: "A session, and the token that presents it.\n\n``token`` is returned exactly once,\
        \ here \u2014 the API stores only its hash, so it cannot\nbe read back. A client that loses it\
        \ signs in again."
      properties:
        email:
          description: The Google account that signed in.
          title: Email
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        token:
          description: 'Send as ''Authorization: Bearer <token>'', like the API token.'
          title: Token
          type: string
      required:
      - token
      - email
      - expires_at
      title: LoginResponse
      type: object
    MarkListenedResponse:
      description: "The result of \"I listened to this\" \u2014 read state, synced (invariant 5)."
      properties:
