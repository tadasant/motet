    HealthResponse:
      description: Liveness plus enough wiring detail to tell 'quiet' from 'unmonitored'.
      properties:
        authenticated:
          description: "Whether /v1 requires a bearer token. False means this deployment is open to anyone\
            \ who can reach it \u2014 legitimate on a laptop, a mistake anywhere else."
          title: Authenticated
          type: boolean
        drain_trigger:
          description: "Whether this process is configured to ask Cloud Run to start a worker execution\
            \ when a request enqueues work, rather than leaving it for the next worker run. Configured,\
            \ not proven: where the environment has no run.invoker grant every ask is refused, and motet.api.drain_triggers{outcome}\
            \ on the obs stack is what says whether asks succeed. False means MOTET_DRAIN_TRIGGER is off\
            \ \u2014 the default \u2014 or that it is on and the job could not be resolved or google-auth\
            \ is missing from the image, both of which the process says at ERROR on startup. Reported\
            \ for the same reason as 'vault_ready': an inert trigger and a working one look identical\
            \ from outside. Where the job lives is deliberately not reported; it is topology, and this\
            \ route is public."
          title: Drain Trigger
          type: boolean
        enrich_enabled:
          default: false
          description: "Whether an 'ingest now' on an item that links to a site the owner added is sent\
            \ to the agentic-enrichment queue first (motet#102). This is the API's own routing switch,\
            \ MOTET_ENRICH; the API never calls the enrichment service and is not told where one is, so\
            \ this cannot report whether a run would succeed \u2014 that is the worker's copy of the switch\
            \ plus its service URL, and a worker with neither records every queued item as skipped and\
            \ integrates it on its preview. False is the deployed state until a human switches it on;\
            \ production stays off longest."
          title: Enrich Enabled
          type: boolean
        errors_configured:
          description: Whether error reporting is configured. False means errors go nowhere.
          title: Errors Configured
          type: boolean
        inference_mode:
          description: '''fake'' or ''real''. ''fake'' means no vendor is ever called.'
          title: Inference Mode
          type: string
        ios_app_link:
          description: "Whether this deployment hands the iOS app its sign-in back on an https link on\
            \ the web app's own host, rather than on the 'motet://' scheme. Reported for 'login_configured's\
            \ reason: a flag that is set but cannot take effect \u2014 a non-https or ported MOTET_APP_BASE_URL\
            \ \u2014 looks exactly like one nobody set, and the fallback it lands on is silent by design."
          title: Ios App Link
          type: boolean
        llm_overrides_in_force:
          anyOf:
          - type: boolean
          - type: 'null'
          description: "Whether any `settings` row is changing what a worker's job runs on right now.\
            \ Reported because an override and a clean environment look identical from outside, and the\
            \ worker's boot log no longer describes what a job runs once one exists. Always false where\
            \ settings_writable is false, without a database read; null when the table could not be read.\
            \ Which stage and which model are not reported here \u2014 that is the admin screen's."
          title: Llm Overrides In Force
        login_configured:
          description: "Whether signing in with Google can succeed for anyone. False means either no allowlist\
            \ is set \u2014 which denies everybody, deliberately \u2014 or, in real mode, no Google OAuth\
            \ client is configured. Reported for the same reason as 'authenticated': a login that denies\
            \ silently looks exactly like one nobody has tried."
          title: Login Configured
          type: boolean
        mcp_oauth_configured:
          description: 'Whether MCP clients can authorize themselves with OAuth (motet#111). False means
            /mcp takes only the API''s bearer: MOTET_PUBLIC_BASE_URL, MOTET_APP_BASE_URL or sign-in is
            not configured.'
          title: Mcp Oauth Configured
          type: boolean
        mcp_tools:
          description: How many tools the MCP server at /mcp registers. Zero would mean the mount is there
            and serves nothing.
          title: Mcp Tools
          type: integer
        revision:
          anyOf:
          - type: string
          - type: 'null'
          description: "The tadasant/motet commit SHA this build was made from \u2014 the deploy's image\
            \ tag, read back out of the OTel 'service.version' resource attribute. Not a Cloud Run revision\
            \ name. null means nothing set it \u2014 a laptop or a bare 'docker run' rather than a deployment\
            \ \u2014 or that what was set is not a shape this public route will repeat, which the process\
            \ says at ERROR on startup. Reported because 'is the pin bump actually live' is the first\
            \ question asked after a deploy, and until now the only answers were diffing the served OpenAPI\
            \ document \u2014 which cannot see a commit that changed only behaviour \u2014 or querying\
            \ the obs stack for a log line this service does not emit per request."
          title: Revision
        service:
          description: OTel service name this process reports as
          title: Service
          type: string
        settings_writable:
          description: "Whether this deployment honours runtime `settings` rows \u2014 per-stage LLM model\
            \ and effort chosen on the admin screen. False in production, where the environment is the\
            \ whole model configuration and no row is read."
          title: Settings Writable
          type: boolean
        status:
          description: '''ok'' when the process is serving'
          title: Status
          type: string
        telemetry_configured:
          description: Whether OTLP export is configured. False means telemetry is a no-op.
          title: Telemetry Configured
          type: boolean
        telemetry_exporting:
          description: "Whether this process actually installed an exporter, which is a different question\
            \ from whether the variables were set. False with telemetry_configured true means the wiring\
            \ is right and the SDK did not start \u2014 check the startup log."
          title: Telemetry Exporting
          type: boolean
        vault_backend:
          description: "Which credential vault this process resolved: 'kms' or 'local'. 'local' in a deployed\
            \ environment is a misconfiguration the process refuses to serve under \u2014 see vault_ready."
          title: Vault Backend
          type: string
        vault_ready:
          description: "Whether a Gmail refresh token could be sealed if one arrived. False means connecting\
            \ a mailbox will fail at the last step of the consent flow, after the provider has already\
            \ issued a token. Reported for the same reason as 'login_configured': the vault is only ever\
            \ exercised by a human finishing a consent flow, so a broken one and an untried one look identical\
            \ from outside. It does not call Cloud KMS \u2014 this route is unauthenticated, and a billed\
            \ vendor call per request would be a free way to spend money."
          title: Vault Ready
          type: boolean
        voice_configured:
          default: false
          description: 'Whether Play Live can mint a voice session here: both MOTET_VOICE_BASE_URL and
            MOTET_VOICE_START_SESSION_TOKEN are set. False is the deployed state until a voice service
            exists. The voice service''s address is not reported; it is topology, and this route is public.'
          title: Voice Configured
          type: boolean
      required:
      - status
      - service
      - revision
      - telemetry_configured
      - telemetry_exporting
      - errors_configured
      - authenticated
      - login_configured
      - ios_app_link
      - vault_backend
      - vault_ready
      - drain_trigger
      - inference_mode
      - settings_writable
      - llm_overrides_in_force
      - mcp_tools
      - mcp_oauth_configured
      title: HealthResponse
      type: object
    HeldSourceItemResponse:
      description: "A source item that is extracted and waiting for the owner to say \"ingest now\".\n\
        \nA connected source polls, fetches and extracts on its own \u2014 the deterministic, free\nhalf\
        \ \u2014 and stops before ``integrate``, the first stage that spends inference. Held is\n``state\
        \ = 'pending'`` with no integrate job, and this is the list of those. A paste\nnever lingers here:\
        \ it queues its job on arrival."
      properties:
        chars:
          description: Length of the extracted text.
          title: Chars
          type: integer
        id:
          title: Id
          type: string
        preview:
          description: The first ~200 characters, whitespace collapsed.
          title: Preview
          type: string
        received_at:
          description: When the message says it was sent (its Date header, clamped to now); when it was
            stored if it had no usable one. For a paste, when it was pasted.
          format: date-time
          title: Received At
          type: string
        source_id:
          title: Source Id
          type: string
        source_kind:
          description: '''gmail'' or ''paste''.'
          title: Source Kind
          type: string
        source_name:
          title: Source Name
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - source_id
      - source_kind
      - source_name
      - received_at
      - chars
      - preview
      title: HeldSourceItemResponse
      type: object
    HighlightResponse:
      description: "A saved passage, anchored to the span of source text it quotes.\n\nThe anchor is the\
        \ source span and nothing else \u2014 claims are rewritten on every script\nretry and audio offsets\
        \ move on every re-render, while a source item's text never\nchanges. ``episode_id`` and ``anchor_ms``\
        \ say where the listener was when they saved\nit: provenance, not the anchor."
      properties:
        anchor_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Anchor Ms
        created_at:
          format: date-time
          title: Created At
          type: string
        episode_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Episode Id
        id:
          title: Id
          type: string
        news_item_id:
          title: News Item Id
          type: string
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
        quote:
          description: "What the source actually says at that span, read from the source item rather than\
            \ taken from the caller \u2014 so a model calling save_highlight cannot write its paraphrase\
            \ in and have it look verbatim."
          title: Quote
          type: string
        source_item_id:
          title: Source Item Id
          type: string
        span:
          $ref: '#/components/schemas/SourceSpanModel'
      required:
      - id
      - news_item_id
      - source_item_id
      - span
      - quote
      - note
      - episode_id
      - anchor_ms
      - created_at
      title: HighlightResponse
      type: object
    IngestionItemResponse:
      description: "One ingested item that has not settled into the backlog yet \u2014 and why not.\n\n\
        This exists because \"pending\" used to be a thing the system knew and never said. A\npaste was\
        \ accepted, queued, retried, and eventually abandoned entirely inside the\nworker, and the only\
        \ surface that could have shown any of it \u2014 the backlog \u2014 lists\nnews items, which is\
        \ precisely what a failed item never becomes.\n\n``attempts`` and ``next_attempt_at`` are here\
        \ so that *retrying* and *stuck* are\ndistinguishable. They are not the same thing to a person\
        \ standing there waiting, and\na spinner that means both is a spinner that means neither.\n\n\
        **Not always a source item.** A mailbox message whose fetch failed has no\n``source_items`` row\
        \ \u2014 that is written when extraction succeeds \u2014 so it is reported\nfrom its extract job,\
        \ under a synthesized ``id`` and a ``title`` naming the provider's\nmessage id. Every other field\
        \ means the same thing either way. Ids are\nopaque to clients and nothing addresses this route's\
        \ rows, so the two shapes are one\nresponse model rather than two (motet#35).\n\n**``last_error``\
        \ is the exception the stage raised, unedited, and that is the decision\nrather than an oversight.**\
        \ It is a new egress: an httpx error names the base URL it\ndialled, a psycopg one names the database\
        \ host. The caller is the deployment's single\nowner behind ``require_caller`` \u2014 the same\
        \ person who reads the obs stack, where the\nidentical string already goes \u2014 so there is\
        \ no reader here who could not already see\nit. Mapping unknown exceptions to a generic string\
        \ would buy nothing from that reader\nand would hand them back the \"Failed\", with no reason,\
        \ that this whole surface exists\nto replace. Revisit it when there is more than one account (Phase\
        \ 3): at that point the\nreader and the operator stop being the same person, and this becomes\
        \ a real leak."
      properties:
        attempts:
          description: Processing attempts spent so far. 0 means it has not been picked up yet.
          title: Attempts
          type: integer
        created_at:
          format: date-time
          title: Created At
          type: string
        id:
          title: Id
          type: string
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          description: What the most recent attempt said, verbatim. Present while retrying as well as
            after failing, because the reason is the thing that says whether to wait, re-paste, or report
            it.
          title: Last Error
        max_attempts:
          description: Attempts before the pipeline gives up and the state becomes 'failed'.
          title: Max Attempts
          type: integer
        next_attempt_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: "When the next attempt is due. Null means there is nothing scheduled: it is either\
            \ being processed right now, or it is finished \u2014 see 'state'."
          title: Next Attempt At
        source_id:
          description: Which source it came from. With two mailboxes connected, 'source_kind' says only
            that it was a mailbox; this says which one.
          title: Source Id
          type: string
        source_kind:
          description: "How this arrived: 'paste' for text pasted in, 'gmail' for a polled mailbox message.\
            \ It decides what a person can do about a failure \u2014 a failed paste can be pasted again,\
            \ and a failed mailbox message cannot, because the poll cursor has already moved past it."
          title: Source Kind
          type: string
        state:
          description: '''pending'' while the queue still owns it, ''failed'' once the retries ran out,
            ''integrated'' for the few minutes after it succeeded.'
          title: State
          type: string
        title:
          title: Title
          type: string
      required:
      - id
      - title
      - state
      - attempts
      - max_attempts
      - next_attempt_at
      - last_error
      - created_at
      - source_kind
      - source_id
      title: IngestionItemResponse
      type: object
    IntegrateResponse:
      properties:
        queued:
          description: Ids that were held and now have an integrate job.
          title: Queued
          type: integer
        skipped:
          description: 'Ids that did not qualify: unknown, another user''s, already queued, already integrated,
            or dismissed. Never an error.'
          title: Skipped
          type: integer
      required:
      - queued
      - skipped
      title: IntegrateResponse
      type: object
    LabelSyncRequest:
      description: 'Set, change, or clear a mailbox''s label-sync settings.


        Both empty turns label sync off. Setting a label does **not** widen the grant: a mailbox

        connected read-only reports ``needs_reauthorization`` until its owner re-consents.'
      properties:
        add_label:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Add Label
        remove_label:
          anyOf:
          - maxLength: 500
            type: string
          - type: 'null'
          title: Remove Label
      title: LabelSyncRequest
      type: object
    LabelSyncResponse:
      description: "One mailbox's label-sync settings, whether they can act, and what they have done.\n\
        \n``status`` is the one field a screen branches on. ``off`` \u2014 no labels set, and nothing\
        \ is\never written. ``needs_reauthorization`` \u2014 labels are set, but the mailbox was connected\n\
        read-only, so nothing is written until its owner re-consents; the write-back records\nthat on\
        \ every deliberate ingest rather than calling Gmail. ``on`` \u2014 labels are set and\nthe grant\
        \ carries ``gmail.modify``."
      properties:
        add_label:
          anyOf:
          - type: string
          - type: 'null'
          description: Label put on a message when it is ingested.
          title: Add Label
        available_labels:
          description: 'Label names read from the mailbox by its last poll, for the pickers: the user''s
            own labels, then the system labels Motet will write (INBOX, UNREAD, STARRED, IMPORTANT). Empty
            until a poll has read them.'
          items:
            type: string
          title: Available Labels
          type: array
        failed_items:
          description: "Ingested items whose message could not be moved, and never was since \u2014 counted\
            \ from when this mailbox was last authorized, so a re-consent clears the failures it resolves."
          title: Failed Items
          type: integer
        labels_read_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: When the label list was last read from the mailbox.
          title: Labels Read At
        last_error:
          anyOf:
          - type: string
          - type: 'null'
          description: Why the newest of those could not be moved.
          title: Last Error
        last_synced_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: The newest time a message from this mailbox was moved.
          title: Last Synced At
        modify_granted:
          description: Whether this mailbox's grant can change labels at all. False for every mailbox
            that has not re-consented for label sync, which is the default.
          title: Modify Granted
          type: boolean
        remove_label:
          anyOf:
          - type: string
          - type: 'null'
          description: Label taken off a message when it is ingested.
          title: Remove Label
        status:
          enum:
          - 'off'
          - needs_reauthorization
          - 'on'
          title: Status
          type: string
      required:
      - status
      - remove_label
      - add_label
      - modify_granted
      - available_labels
      - labels_read_at
      - last_synced_at
      - failed_items
      - last_error
      title: LabelSyncResponse
      type: object
    ListenProgressRequest:
      description: 'How far into an episode the listener has got.


        Invariant 4: we own playback position, so this is a *report* from a client that we

        record, never a value read back out of a vendor SDK. Invariant 5 is what it does: a

        story whose segment has been passed is marked read, which is the same fact the backlog

        screen''s toggle writes.


        The body of both ``PUT /v1/episodes/{id}/position`` and

        ``POST /v1/episodes/{id}/progress``, because they are one write. The name is the

        server''s: ``spoken_through_ms`` is the voice session contract''s word for a position

        that moves backwards when a listener seeks back, and this value deliberately does not.'
      properties:
        listened_through_ms:
          description: "Monotonic on the server: seeking backwards is reviewing, not un-listening, so\
            \ a smaller value never lowers the recorded position or un-marks a story. Send the furthest\
            \ point reached rather than the playhead \u2014 the response carries the value that was actually\
            \ stored, which is what to resume from."
          minimum: 0.0
          title: Listened Through Ms
          type: integer
      required:
      - listened_through_ms
      title: ListenProgressRequest
      type: object
    ListenProgressResponse:
      properties:
        episode_id:
          title: Episode Id
          type: string
        listened_through_ms:
          description: The position after applying monotonicity.
          title: Listened Through Ms
          type: integer
        news_items_marked_read:
          title: News Items Marked Read
          type: integer
      required:
      - episode_id
      - listened_through_ms
      - news_items_marked_read
