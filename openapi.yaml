    ProcessingStatusResponse:
      description: "Whether anything is actually draining the queues \u2014 motet#38's missing fact.\n\
        \nThe Processing panel used to tell the user \"a worker takes it off the queue within a\nfew seconds\"\
        \ whatever was true, because nothing in the system could say otherwise: a\nqueued item looks the\
        \ same whether a worker is chewing through a backlog or whether no\nworker has run since Tuesday.\
        \ The client cannot derive it either \u2014 an item's age says\nhow long it has waited, not whether\
        \ anything is coming.\n\n``worker_last_seen_at`` is null when no worker has *ever* run against\
        \ this database,\nwhich is a different statement from \"one ran a while ago\" and reads differently\
        \ on\nscreen. Per-queue rows are here for the operator's version of the same question; the\nSPA\
        \ reads the aggregate, because a Phase 1 deployment runs one process over all of\nthem (``runner\
        \ all``).\n\n``now`` is here so the client never has to compare a database timestamp against a\n\
        browser clock. It is a small field against a whole class of wrongness: a laptop\nresumed from\
        \ sleep, or an unsynced VM, would otherwise report a perfectly healthy\nworker as gone and put\
        \ a red banner over a pipeline that is running fine."
      properties:
        now:
          description: "The server's clock, at the moment this was answered. Every other timestamp the\
            \ SPA ages \u2014 this one, an item's created_at \u2014 comes from the same clock, so a client\
            \ that subtracts from this rather than from its own is immune to the two disagreeing."
          format: date-time
          title: Now
          type: string
        queues:
          description: Per queue, most recently drained first. Absent queues have never run.
          items:
            $ref: '#/components/schemas/QueueHeartbeatResponse'
          title: Queues
          type: array
        readiness:
          description: 'Per queue, in pipeline order: how much work is due and how many workers could
            take it. Every queue is present, at zero when it has nothing.'
          items:
            $ref: '#/components/schemas/QueueReadinessResponse'
          title: Readiness
          type: array
        worker_last_seen_at:
          anyOf:
          - format: date-time
            type: string
          - type: 'null'
          description: 'When any worker last ran a drain pass, over any queue. Null means none ever has:
            nothing will happen to a queued item until one does.'
          title: Worker Last Seen At
      required:
      - now
      - worker_last_seen_at
      - queues
      - readiness
      title: ProcessingStatusResponse
      type: object
    QueueHeartbeatResponse:
      description: One queue, and when a worker was last draining it.
      properties:
        last_seen_at:
          format: date-time
          title: Last Seen At
          type: string
        queue:
          title: Queue
          type: string
      required:
      - queue
      - last_seen_at
      title: QueueHeartbeatResponse
      type: object
    QueueReadinessResponse:
      description: "One queue's scaling signal: what is due, and how many workers could take it.\n\nSeparate\
        \ from :class:`QueueHeartbeatResponse` rather than folded into it, because the\ntwo lists answer\
        \ different questions over different sets. A heartbeat exists only for a\nqueue a worker has *run*;\
        \ readiness exists for every queue, and the case it has to\ncover is precisely the one with no\
        \ worker \u2014 a queue scaled to zero emits no gauge, so\nthis route is the only place its backlog\
        \ is visible (motet#78). Merging them would\nhave meant widening ``last_seen_at`` to nullable,\
        \ which is a breaking change to a\nshipped field for no gain."
      properties:
        blocked_keys:
          description: "How many of those keys are already held by somebody right now, so the work is\
            \ waiting on a worker that has it rather than on a worker that does not exist. Nonzero is\
            \ the healthy case \u2014 a key is held whenever somebody is working it. This staying pinned\
            \ while `ready` does not fall is the signal worth looking at: it is what a leaked or wedged\
            \ advisory lock looks like."
          title: Blocked Keys
          type: integer
        queue:
          title: Queue
          type: string
        ready:
          description: "Jobs on this queue that are ready and due now. Excludes anything backing off up\
            \ the retry ladder or deferred because its serialization key was busy \u2014 neither is work\
            \ a new worker could pick up. It also excludes work already `running`, so it is zero while\
            \ a job is still going: a scaler needs a floor of one wherever a worker heartbeat is fresh."
          title: Ready
          type: integer
        ready_keys:
          description: "How many of those jobs could be worked on at the same time: distinct serialization\
            \ keys, plus one for each job that has no key. On a serialized queue (`integrate`, `poll`)\
            \ this is the number of users with work waiting, which is the number of workers the queue\
            \ can keep busy \u2014 invariant 6 holds the rest to one at a time. On an unserialized queue\
            \ it equals `ready`."
          title: Ready Keys
          type: integer
      required:
      - queue
      - ready
      - ready_keys
      - blocked_keys
      title: QueueReadinessResponse
      type: object
    ReadStateRequest:
      description: 'Mark one news item read or unread.


        A body rather than two endpoints, because "unread" is a real thing a user wants: the

