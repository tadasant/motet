    HighlightResponse:
      description: "A saved passage, anchored to the span of source text it quotes.\n\nThe anchor is the\
        \ source span and nothing else \u2014 claims are rewritten on every script\nretry and audio offsets\
        \ move on every re-render, while a source item's text never\nchanges. ``episode_id`` and ``anchor_ms``\
        \ say where the listener was when they saved\nit: provenance, not the anchor."
      properties:
