[project]
name = "motet-api"
version = "0.1.0"
description = "Motet HTTP API (FastAPI, Cloud Run)"
requires-python = ">=3.13"
dependencies = [
    # 0.121 is where `Depends(..., scope=...)` arrived, and `motet_api.deps.connection` is
    # `scope="function"` on purpose: it commits, and nudges the worker, before the
    # response starts rather than after it is sent.
    "fastapi>=0.121",
    # Ambient credentials for the Cloud Run job invoke `motet_api.drain` makes: the API
    # already runs as its own service account, so there is no key to mount. `[requests]`
    # because `google.auth.transport.requests` is the transport the refresh goes over, and
    # it lives behind that extra — declared explicitly rather than inherited through
    # `motet-storage`'s `google-cloud-storage`, which is the same "an extra nobody
    # depended on" shape that shipped every image without `google-cloud-kms`. The SDK is
    # imported at trigger-construction rather than inside the call, so a missing one is an
    # ERROR at startup and `drain_trigger: false` on /internal/health instead of silence
    # inside a best-effort call; `bin/build-images` puts that to a real container.
    "google-auth[requests]>=2.38",
    # The API talks to Google's token endpoint directly — for a sign-in, and for the Gmail
    # code exchange the OAuth callback performs. `motet-sources` declares httpx as an
    # optional extra because a *worker* in fake mode needs no HTTP client; the API's
    # dependency on it is not optional, and the image is built with default extras only.
    "httpx>=0.28",
    "motet-db",
    "motet-inference",
    "motet-obs",
    # The OAuth callback lands on an HTTP route, so the API is where a third-party token
    # first arrives — and therefore where it must be sealed. It takes the encrypt-only
    # half of the vault (`build_dek_wrapper`) and never the decrypt half: invariant 8.
    "motet-sources",
    "motet-storage",
    # `[kms]`, not bare, and this is the whole of the Gmail-connect fix. Sealing a token
    # in a deployed environment goes through Cloud KMS, the SDK is imported lazily inside
    # `CloudKmsKeyManager`, and the extra that carries it was on nobody's dependency
    # edge — so every image built with `uv sync --no-dev` (default extras only, see the
    # note on httpx above) shipped without it. The failure landed as far from its cause as
    # it is possible to land: inside the OAuth callback, after Google had already returned
    # a refresh token, as an unhandled 500 the browser could only report as
    # `TypeError: Failed to fetch`. The lazy import keeps a laptop off the cloud SDK; it
    # was never a reason for the *image* to be missing it.
    "motet-vault[kms]",
    "motet-workers",
    "pydantic>=2.10",
    # Google Sign-In verifies an ID token's RS256 signature against Google's published
    # JWKS. Pure Python on top of `cryptography`, which motet-vault already brings — and
    # hand-rolling JWT verification is precisely the code that must not be hand-rolled,
    # because a bug in it authenticates the attacker rather than crashing.
    "pyjwt[crypto]>=2.10",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[tool.uv.sources]
motet-db = { workspace = true }
motet-inference = { workspace = true }
motet-obs = { workspace = true }
motet-sources = { workspace = true }
motet-storage = { workspace = true }
motet-vault = { workspace = true }
motet-workers = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motet_api"]
