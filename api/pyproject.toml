[project]
name = "motet-api"
version = "0.1.0"
description = "Motet HTTP API (FastAPI, Cloud Run)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "motet-db",
    "motet-inference",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "uvicorn>=0.34",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motet_api"]
