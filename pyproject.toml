# uv workspace root. Each deployable/library is a member; this file holds only the
# shared dev toolchain and the lint/type/test configuration for the whole tree.
[project]
name = "motet"
version = "0.1.0"
description = "Motet — an interactive podcast built from your own reading backlog"
requires-python = ">=3.13"
dependencies = [
    "motet-api",
    "motet-db",
    "motet-inference",
    "motet-sources",
    "motet-storage",
    "motet-vault",
    "motet-voice",
    "motet-workers",
]

[tool.uv]
# The root is a virtual workspace: it pins the toolchain and configuration for the whole
# tree but is not itself an installable package.
package = false

[tool.uv.workspace]
members = ["api", "db", "inference", "sources", "storage", "vault", "voice", "workers"]

[tool.uv.sources]
motet-api = { workspace = true }
motet-db = { workspace = true }
motet-inference = { workspace = true }
motet-sources = { workspace = true }
motet-storage = { workspace = true }
motet-vault = { workspace = true }
motet-voice = { workspace = true }
motet-workers = { workspace = true }

[dependency-groups]
dev = [
    # Two independent RSS parsers, because "valid XML" and "a podcast client will play it"
    # are different claims. `podcastparser` is the parser inside gPodder, an actual podcast
    # client; `feedparser` is what most other tooling uses. A feed both accept is a feed
    # Overcast and Apple Podcasts accept.
    "feedparser>=6.0",
    "httpx>=0.28",
    "podcastparser>=0.6",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-pyyaml>=6.0.12.20260815",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20"]  # T20 bans print() — use the logger (AGENTS.md)

[tool.ruff.lint.per-file-ignores]
# The one place print() is right: a hand-run CLI whose entire product is its stdout
# report. Stated here rather than dodged by leaving the file out of the linter's reach.
"inference/src/motet_inference/llm/check_models.py" = ["T201"]
# Same exemption, same reason: `motet-voice` is a hand-run CLI whose entire product is the
# report it prints. Stated here rather than dodged by excluding the file from the linter.
"voice/src/motet_voice/cli.py" = ["T201"]

[tool.mypy]
python_version = "3.13"
strict = true
files = [
    "api/src",
    "db/src",
    "inference/src",
    "ios/tools",
    "sources/src",
    "storage/src",
    "vault/src",
    "voice/src",
    "workers/src",
    "goldens",
]

# The Google Cloud SDK ships no py.typed marker, so every symbol from it is untyped as
# far as strict mode is concerned. Scoped to the one package rather than relaxed globally:
# our own code stays strict, including the thin GCS wrapper around it.
[[tool.mypy.overrides]]
module = ["google.cloud.*"]
ignore_missing_imports = true

# `webrtcvad` is an OPTIONAL dependency of the barge-in harness — a C extension that gives
# the sweep a second, incumbent VAD to compare ours against. It is imported lazily and the
# harness runs without it, so it is not declared anywhere and mypy cannot see stubs for it.
[[tool.mypy.overrides]]
module = ["webrtcvad"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
    "api/tests",
    "db/tests",
    "inference/tests",
    "sources/tests",
    "storage/tests",
    "vault/tests",
    "voice/tests",
    "workers/tests",
    "goldens",
]
addopts = "-q"
