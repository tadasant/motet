[project]
name = "motet-db"
version = "0.1.0"
description = "Schema, forward-only SQL migrations, and the migration runner"
requires-python = ">=3.13"
dependencies = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/motet_db"]
